# CodeQL code scanning, advanced setup: the languages and triggers of GitHub's default setup, with test/ left out of
# the scan (.github/codeql/codeql-config.yml). The category of each language is default setup's (/language:<lang>), so
# the open alerts carry over: the ones in test/ close as fixed on main's next analysis, the others stay.
# Advanced setup cannot upload while default setup is on: default setup is switched off in the repository's settings
# (Code security, CodeQL analysis).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
