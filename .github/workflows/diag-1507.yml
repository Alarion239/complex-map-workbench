name: Diag 1507 (temporary)
# TEMPORARY (#1507, deleted before the pull request), on Ubuntu 26.04 (Mesa 26): the four slowest browser shards twice
# on one machine, with and without GALLIUM_OVERRIDE_CPU_CAPS=avx (the order alternates), for their wall times; and the
# layout shards with it, for the new layout baseline.
on:
  push:
    branches: [claude/p1perf-1507]
permissions:
  contents: read
jobs:
  diag:
    name: ${{ matrix.shard }} (${{ matrix.kind }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: views-2, kind: speed, first: plain }
          - { shard: export-4, kind: speed, first: avx }
          - { shard: views-3, kind: speed, first: avx }
          - { shard: tour, kind: speed, first: plain }
          - { shard: layout-1, kind: layout, first: avx }
          - { shard: layout-2, kind: layout, first: avx }
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      CMW_ANGLE: vulkan
      CMW_CHROME_ARGS: --no-sandbox --enable-features=Vulkan --use-vulkan=native --disable-vulkan-surface
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Mesa's Vulkan drivers (lavapipe)
        run: mkdir -p "$RUNNER_TEMP/debs" && ci/lavapipe.sh "$RUNNER_TEMP/debs"
      - name: CPU
        run: |
          lscpu | grep 'Model name'
          python3 build.py
      - name: Shard, plain (first)
        if: matrix.first == 'plain'
        continue-on-error: true
        run: node ci/browser.js --no-build --shard ${{ matrix.shard }}
      - name: Shard, avx
        continue-on-error: true
        env:
          GALLIUM_OVERRIDE_CPU_CAPS: avx
        run: node ci/browser.js --no-build --shard ${{ matrix.shard }}
      - name: Shard, plain (second)
        if: matrix.first == 'avx' && matrix.kind == 'speed'
        continue-on-error: true
        run: node ci/browser.js --no-build --shard ${{ matrix.shard }}
