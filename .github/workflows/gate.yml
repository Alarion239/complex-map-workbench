# The gate on GitHub's machines (ci/README.md): unit tests (Linux), GLSL conformance (Windows, macOS; only the pages
# whose shader code or tests changed), image quality (Linux, Windows, macOS), each change measured against its
# reference (the PR's base, or the previous main) on the same machine. Speed is gated on our own machines with real
# GPUs (.github/workflows/gpu-gate.yml); until they are registered (the variable GPU_RUNNERS), the paired perf suite
# runs here on Windows (desktop units and an emulated phone; software rendering, so it catches gross slowdowns and
# shader-compile costs, not real frame rates). By hand (Run workflow, perf) it runs here on Windows and macOS.
name: Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reference:
        description: Commit or branch the paired gates compare against (empty = the previous main commit, or the branch's merge base with main)
        required: false
        default: ''
      force:
        description: Run the paired gates even when the app (src/, build.py) did not change
        type: boolean
        default: false
      perf:
        description: Also run the perf suite here (Windows; macOS advisory), as when the GPU machines are not registered
        type: boolean
        default: false
      shards:
        description: Only these perf shards (comma-separated ids of ci/perf_shards.js; empty = all)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  FORCE: ${{ inputs.force && '--force' || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reference: ${{ steps.ref.outputs.reference }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: ref
        name: Reference of the paired gates
        shell: bash
        run: |
          set -eu
          case "${{ github.event_name }}" in
            pull_request) ref="${{ github.event.pull_request.base.sha }}" ;;
            push) ref="${{ github.event.before }}"
                  if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then ref=$(git rev-parse HEAD~1); fi ;;
            *) ref="${{ inputs.reference }}"
               if [ -z "$ref" ]; then
                 if [ "${{ github.ref }}" = refs/heads/main ]; then ref=$(git rev-parse HEAD~1); else ref=$(git merge-base origin/main HEAD); fi
               fi ;;
          esac
          sha=$(git rev-parse --verify "$ref^{commit}")
          echo "reference=$sha" >> "$GITHUB_OUTPUT"
          echo "Reference of the paired gates: \`$sha\` ($ref)" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet "$sha" -- src build.py; then echo "The app (src/, build.py) is unchanged since the reference: the paired gates have nothing to compare." >> "$GITHUB_STEP_SUMMARY"; fi
      - id: shards
        name: Perf shards (every unit in exactly one)
        shell: bash
        run: |
          node ci/perf_shards.js check
          if [ -n "${{ inputs.shards }}" ]; then s=$(node ci/perf_shards.js matrix --only "${{ inputs.shards }}"); else s=$(node ci/perf_shards.js matrix); fi
          echo "shards=$s" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the construction tests' absolute speed limits were set on the development Mac
      CMW_SPEED_SCALE: '3'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/snapshots.js
      - run: node ci/unit.js
      - name: The gates' own tests
        run: python3 test/regress/test_compare.py

  glsl:
    name: GLSL (${{ matrix.os }}, ${{ matrix.page }} ${{ matrix.part }})
    # each platform's own shader compiler (Direct3D 11's on Windows, Metal's on macOS), paired: the reference's pages run
    # on the same machine, and this change fails only where it is worse (GPUs differ near removable singularities).
    # Windows renders in software (WARP: 15 minutes and more for a quarter of the glsl page), so its pages run in small parts;
    # macOS has a virtual GPU (a minute a page) and few machines (5 at a time), so its pages run whole. A page whose
    # shader code and tests are the same as the reference's is not run (ci/glsl.js).
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, page: glsl, part: 1/8 }
          - { os: windows-latest, page: glsl, part: 2/8 }
          - { os: windows-latest, page: glsl, part: 3/8 }
          - { os: windows-latest, page: glsl, part: 4/8 }
          - { os: windows-latest, page: glsl, part: 5/8 }
          - { os: windows-latest, page: glsl, part: 6/8 }
          - { os: windows-latest, page: glsl, part: 7/8 }
          - { os: windows-latest, page: glsl, part: 8/8 }
          - { os: windows-latest, page: adv, part: 1/4 }
          - { os: windows-latest, page: adv, part: 2/4 }
          - { os: windows-latest, page: adv, part: 3/4 }
          - { os: windows-latest, page: adv, part: 4/4 }
          - { os: windows-latest, page: inverse, part: 1/1 }
          - { os: macos-latest, page: glsl, part: 1/1 }
          - { os: macos-latest, page: adv, part: 1/1 }
          - { os: macos-latest, page: inverse, part: 1/1 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      - run: node ci/glsl.js --only ${{ matrix.page }} --part ${{ matrix.part }} --ref ${{ needs.plan.outputs.reference }} ${{ env.FORCE }}

  quality:
    name: Quality (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: ['1/3', '2/3', '3/3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CMW_CHROME_ARGS: ${{ startsWith(matrix.os, 'ubuntu') && '--no-sandbox' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      - run: node ci/quality.js --ref ${{ needs.plan.outputs.reference }} --shard ${{ matrix.shard }} ${{ env.FORCE }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-${{ runner.os }}-${{ strategy.job-index }}
          path: .ci/quality/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Perf (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    # speed is gated on our GPU machines once they are registered; here until then, and by hand
    if: vars.GPU_RUNNERS != 'true' || inputs.perf
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.perf && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      # (virtual machines: busy neighbours swing timings by tens of percent, so only gross slowdowns fail here, with
      # 3-fold allowances; software rendering settles slower than a GPU. The macOS machine's virtual GPU swings both
      # ways by more than that within one unit, so there the results are reported, not gated: macOS speed is gated on
      # our Mac, in the GPU gate.)
      - run: node ci/perf_shard.js --shard ${{ matrix.shard }} --ref ${{ needs.plan.outputs.reference }} --reps 2 --tol-scale 3 --settle-timeout 60000 ${{ startsWith(matrix.os, 'macos') && '--advisory' || '' }} ${{ env.FORCE }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-${{ runner.os }}-${{ matrix.shard }}
          path: .ci/perf/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Gate
    if: always()
    needs: [plan, unit, glsl, quality, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the gate passed
        run: echo "plan ${{ needs.plan.result }}, unit ${{ needs.unit.result }}, glsl ${{ needs.glsl.result }}, quality ${{ needs.quality.result }}, perf ${{ needs.perf.result }}"
      # (perf is skipped when the GPU machines gate speed)
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.plan.result != 'success' ||
          needs.unit.result != 'success' || needs.glsl.result != 'success' || needs.quality.result != 'success'
        run: exit 1
