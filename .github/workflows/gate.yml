# The gate on GitHub's machines (ci/README.md): unit tests (Linux), the functional browser suites (Linux), GLSL
# conformance (Windows, macOS; only the pages whose shader code or tests changed), image quality (Linux, Windows,
# macOS), each change measured against its
# reference (the PR's base, or the previous main) on the same machine. Speed is gated on our own machines with real
# GPUs (.github/workflows/gpu-gate.yml); until they are registered (the variable GPU_RUNNERS), the paired perf suite
# runs here on Windows (desktop units and an emulated phone), and by hand (Run workflow, perf) on Windows and macOS.
# GitHub's machines are shared and render in software: their timings swing by more than any tolerance, so here the
# perf jobs gate the suite's checks (a view that does not move, a compile during a hover, a page error) and only report
# slower timings (--advisory).
# Tiers (ci/README.md, CI tiers): a pull request runs the jobs it can affect (ci/impact.js chooses them in the plan
# job); a push to main, the nightly run, a run by hand and the label full-gate run them all. On Windows the GLSL
# pages run their core tier on a pull request, every chain otherwise and with the label glsl-deep (ci/README.md, GLSL
# tiers). Every job runs on GitHub's machines: nothing here waits for one of ours.
name: Gate

on:
  pull_request:
    # (labeled: the label full-gate runs the whole gate on any pull request; another label restarts the run in its tier.
    # ready_for_review: a pull request into main runs the whole gate once it is not a draft; into another branch it
    # runs nothing when its push's run on the same commit already passed, its tier otherwise, #379)
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  push:
    branches: [main]
  # the nightly whole gate (on main, against the previous main)
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      reference:
        description: Commit or branch the paired gates compare against (empty = the previous main commit, or the branch's merge base with main)
        required: false
        default: ''
      force:
        description: Run the paired gates even when the app (src/, build.py) did not change
        type: boolean
        default: false
      perf:
        description: Also run the perf suite here (Windows and macOS; timings advisory), as when the GPU machines are not registered
        type: boolean
        default: false
      shards:
        description: Only these perf shards or parts of them (comma-separated ids of ci/perf_shards.js; empty or all = every shard)
        required: false
        default: ''
      glsl:
        description: GLSL on Windows, every chain (all) or the core tier (core); macOS runs every chain either way
        type: choice
        options: [all, core]
        default: all

permissions:
  contents: read

concurrency:
  # (a pull request into another branch than main marked ready for review: a group of its own, so that it never cancels
  # its push's run still in progress, #379; see the job ready)
  group: gate-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'ready_for_review' && github.event.pull_request.base.ref != 'main' && '-ready' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  FORCE: ${{ inputs.force && '--force' || '' }}

jobs:
  # (#379) a pull request into another branch than main marked ready for review: the Gate run of this PR on the same
  # commit that passed, or that is still queued or running (its push's run), if the newest one is (mirror: its id). Then
  # nothing runs again (the plan's tier none) and the Gate job carries that run's verdict: at once when it passed,
  # once it ends when it is still going (the same tier on the same commit twice was the waste). Otherwise (failed,
  # cancelled, none; any other event, a PR into main) mirror is empty and the run is the usual one. Either way a green
  # Gate never stands on a commit before a gate passed on it
  ready:
    name: Ready for review, already gated?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      mirror: ${{ steps.look.outputs.mirror || steps.cover.outputs.mirror }}
      mirror_pr: ${{ steps.look.outputs.mirror && github.event.pull_request.number || steps.cover.outputs.mirror_pr }}
      mirror_sha: ${{ steps.look.outputs.mirror && github.event.pull_request.head.sha || steps.cover.outputs.mirror_sha }}
    steps:
      # (ci/gate_run_of.sh)
      - uses: actions/checkout@v5
        with:
          sparse-checkout: ci/gate_run_of.sh
          sparse-checkout-cone-mode: false
      - id: look
        if: github.event.action == 'ready_for_review' && github.event.pull_request.base.ref != 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "mirror=" >> "$GITHUB_OUTPUT"; exit 0; }
          other=$(ci/gate_run_of.sh "$HEAD_SHA" "$PR") && found=1 || found=0
          echo "the newest other Gate run of #$PR on $HEAD_SHA: $other"
          if [ "$found" = 1 ]; then
            case "$other" in
              *" completed success") echo "mirror=${other%% *}" >> "$GITHUB_OUTPUT"
                                     echo "Gated by run ${other%% *} of this PR on this commit (it passed): nothing runs again." >> "$GITHUB_STEP_SUMMARY" ;;
              *) echo "mirror=${other%% *}" >> "$GITHUB_OUTPUT"
                 echo "Run ${other%% *} of this PR is gating this commit ($other): nothing runs again; the Gate job waits for it and carries its verdict." >> "$GITHUB_STEP_SUMMARY" ;;
            esac
          else
            echo "mirror=" >> "$GITHUB_OUTPUT"
            echo "No passing Gate run of this PR on this commit yet ($other): this run gates it." >> "$GITHUB_STEP_SUMMARY"
          fi
      # (#787) a pull request into another branch than main whose head another open pull request into the same branch
      # contains (a stack: each head holds the lower ones): the top of the stack gates all of them, so this one carries
      # that run's verdict instead of running its own tier. The compare API says which open PRs contain this head; the
      # one furthest ahead is the top. Switched on by the repository variable GATE_STACK_SKIP = on; otherwise the summary
      # only says what would have happened and the run is the usual one
      - id: cover
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main' && steps.look.outputs.mirror == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          SWITCH: ${{ vars.GATE_STACK_SKIP }}
        run: |
          set -u
          [[ "$PR" =~ ^[0-9]+$ ]] || exit 0
          top=''; ahead=0
          while read -r n sha; do
            [ "$n" = "$PR" ] && continue
            st=$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...$sha" --jq '"\(.status) \(.ahead_by)"') || continue
            case "$st" in "ahead "*) a=${st#ahead }; if [ "$a" -gt "$ahead" ]; then ahead=$a; top="$n $sha"; fi ;; esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE&per_page=100" --paginate --jq '.[] | "\(.number) \(.head.sha)"' || true)
          if [ -z "$top" ]; then echo "No open pull request into $BASE contains this head: this run gates it." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          tn=${top%% *}; ts=${top##* }
          other=$(ci/gate_run_of.sh "$ts" "$tn") && found=1 || found=0
          echo "#$tn ($ts) contains this head; its newest Gate run on it: $other"
          if [ "$found" != 1 ]; then
            echo "#$tn contains this head, but has no passing or running Gate run on it yet ($other): this run gates it." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          run=${other%% *}
          if [ "$SWITCH" != on ]; then
            echo "Report only (GATE_STACK_SKIP is not on): #$tn contains this head and run $run gates it ($other); with the switch on, this run would carry that verdict and run nothing. It runs its own tier." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          echo "mirror=$run" >> "$GITHUB_OUTPUT"; echo "mirror_pr=$tn" >> "$GITHUB_OUTPUT"; echo "mirror_sha=$ts" >> "$GITHUB_OUTPUT"
          echo "Stacked under #$tn: run $run of #$tn on $ts contains this head and gates it ($other); nothing runs here and the Gate job carries its verdict." >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Plan
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      reference: ${{ steps.ref.outputs.reference }}
      shards: ${{ steps.shards.outputs.shards }}
      tier: ${{ steps.tier.outputs.tier }}
      why: ${{ steps.tier.outputs.why }}
      browser: ${{ steps.tier.outputs.browser }}
      glsl: ${{ steps.tier.outputs.glsl }}
      quality: ${{ steps.tier.outputs.quality }}
      perf: ${{ steps.tier.outputs.perf }}
      quality_force: ${{ steps.tier.outputs.quality_force }}
      perf_force: ${{ steps.tier.outputs.perf_force }}
      mirror: ${{ needs.ready.outputs.mirror }}
      mirror_pr: ${{ needs.ready.outputs.mirror_pr }}
      mirror_sha: ${{ needs.ready.outputs.mirror_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: ref
        name: Reference of the paired gates
        shell: bash
        run: |
          set -eu
          case "${{ github.event_name }}" in
            pull_request) ref="${{ github.event.pull_request.base.sha }}" ;;
            push) ref="${{ github.event.before }}"
                  if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then ref=$(git rev-parse HEAD~1); fi ;;
            *) ref="${{ inputs.reference }}"
               if [ -z "$ref" ]; then
                 if [ "${{ github.ref }}" = refs/heads/main ]; then ref=$(git rev-parse HEAD~1); else ref=$(git merge-base origin/main HEAD); fi
               fi ;;
          esac
          sha=$(git rev-parse --verify "$ref^{commit}")
          echo "reference=$sha" >> "$GITHUB_OUTPUT"
          echo "Reference of the paired gates: \`$sha\` ($ref)" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet "$sha" -- src build.py tools/src_parts.py; then echo "The app (src/, build.py, tools/src_parts.py) is unchanged since the reference: the paired gates have nothing to compare." >> "$GITHUB_STEP_SUMMARY"; fi
      - id: shards
        name: Perf shards (every unit in exactly one)
        shell: bash
        run: |
          node ci/perf_shards.js check
          if [ -n "${{ inputs.shards }}" ]; then s=$(node ci/perf_shards.js matrix --only "${{ inputs.shards }}"); else s=$(node ci/perf_shards.js matrix); fi
          echo "shards=$s" >> "$GITHUB_OUTPUT"
      - name: Browser shards (every suite in exactly one)
        run: node ci/browser_shards.js check
      # the standards check (ci/README.md, Standards check): history words, plan labels and dropped assertions on the
      # lines this change adds; it reports in the job summary and as warnings, and never fails the job
      - name: Standards check (report only)
        run: node ci/standards.js --ref "${{ steps.ref.outputs.reference }}" --github
      # the tier and the jobs this change can affect (ci/impact.js; ci/README.md, CI tiers): a push to main, the
      # nightly run, a run by hand, the label full-gate and a pull request into main that is not a draft (a wave PR
      # marked ready for review) run everything; a draft into main, like any pull request into another branch, runs its
      # tier
      - id: tier
        name: Tier
        shell: bash
        env:
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-gate') }}
          DEEP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'glsl-deep') }}
          GLSL_INPUT: ${{ inputs.glsl }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE: ${{ github.event.pull_request.base.ref }}
          REF: ${{ steps.ref.outputs.reference }}
          # (#379: marked ready for review into another branch than main, a passing Gate run of this PR on the same commit,
          # the job ready: nothing is selected)
          MIRROR: ${{ needs.ready.outputs.mirror }}
          MIRROR_PR: ${{ needs.ready.outputs.mirror_pr }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          if [ -n "$MIRROR" ]; then
            if [ "$MIRROR_PR" = "$PR" ]; then
              why="marked ready for review into ${BASE}: run ${MIRROR} of this PR gates this commit (passed, or still running: the Gate job carries its verdict); nothing to re-run"
            else
              why="stacked under #${MIRROR_PR}: run ${MIRROR} of #${MIRROR_PR}, whose head contains this one, gates this commit (passed, or still running: the Gate job carries its verdict); nothing to re-run"
            fi
            printf '%s\n' "tier=none" "why=$why" "browser=[]" "glsl=[]" "quality=[]" "perf=false" "quality_force=" "perf_force=" >> "$GITHUB_OUTPUT"
            printf '**Tier none**: %s\n' "$why" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          full=''
          if [ "${{ github.event_name }}" != pull_request ]; then full="${{ github.event_name }}"
          elif [ "$FULL_LABEL" = true ]; then full="the label full-gate"
          elif [ "$BASE" = main ] && [ "$DRAFT" != true ]; then full="a pull request into main, ready for review"; fi
          # (GLSL tiers, ci/README.md: every chain on Windows only on a push to main, the nightly run, a run by hand (its
          # glsl input) and the label glsl-deep; a pull request, the label full-gate included, runs the core tier there)
          deep=''
          case "${{ github.event_name }}" in
            push|schedule) deep="${{ github.event_name }}" ;;
            workflow_dispatch) if [ "$GLSL_INPUT" != core ]; then deep="a run by hand"; fi ;;
            pull_request) if [ "$DEEP_LABEL" = true ]; then deep="the label glsl-deep"; fi ;;
          esac
          args=(--ref "$REF" --github)
          if [ -n "$full" ]; then args+=(--full "$full"); fi
          if [ -n "$deep" ]; then args+=(--glsl-deep "$deep"); fi
          node ci/impact.js "${args[@]}"

  unit:
    name: Unit tests
    # (not when the job ready found a passing Gate run of this PR on the same commit, #379)
    needs: ready
    if: needs.ready.outputs.mirror == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the construction tests' absolute speed limits were set on the development Mac
      CMW_SPEED_SCALE: '3'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/snapshots.js
      - run: node ci/unit.js
      - name: The gates' own tests
        run: python3 test/regress/test_compare.py

  glsl:
    name: GLSL (${{ matrix.os }}, ${{ matrix.page }}${{ matrix.tier == 'core' && ' core' || '' }}${{ matrix.sections && format(' {0}', matrix.sections) || '' }} ${{ matrix.part }})
    # each platform's own shader compiler (Direct3D 11's on Windows, Metal's on macOS), paired: the reference's pages run
    # on the same machine, and this change fails only where it is worse (GPUs differ near removable singularities).
    # Windows renders in software (WARP: glsl 1/8 8-24 min, inverse whole 34-35 min, adv's direct/keys/compile 34 min,
    # its chains 2 min a quarter), so glsl runs in eighths and adv in two jobs (its sections; its chains, which alone
    # split by part, are cheap);
    # macOS has a virtual GPU (a minute a page) and few machines (5 at a time), so its pages run whole. A page whose
    # shader code and tests are the same as the reference's is not run (ci/glsl.js).
    needs: plan
    if: needs.plan.outputs.glsl != '[]'
    strategy:
      fail-fast: false
      matrix:
        # (the jobs: GLSL_JOBS in ci/impact.js; only the pages this change can affect, all of them for the whole gate)
        include: ${{ fromJSON(needs.plan.outputs.glsl) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      # Windows compiles every shader program on the CPU (Direct3D 11's FXC behind ANGLE): nearly all of a page's time.
      # Chrome's GPU program cache (CMW_GLSL_CACHE, ci/glsl.js) is kept between runs per job, keyed by the shader code and
      # the test pages and restored from the nearest earlier key, so only programs whose source changed compile (the
      # reference's, and this change's unchanged ones, come from the cache). Saved even when the job fails or times out:
      # what it compiled is kept for the next run
      # (a cache key may not hold a comma: the job's name in it with "+" for "," and "-" for "/")
      - name: Shader cache key
        if: runner.os == 'Windows'
        id: shkey
        shell: bash
        run: echo "job=$(printf '%s-%s-%s' '${{ matrix.page }}' '${{ matrix.sections }}' '${{ matrix.part }}' | tr ',/' '+-')" >> "$GITHUB_OUTPUT"
      - name: Shader cache (restore)
        if: runner.os == 'Windows'
        id: shaders
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cmw-glsl-cache
          key: glsl-${{ runner.os }}-${{ steps.shkey.outputs.job }}-${{ hashFiles('src/glsl.js', 'src/gl/**', 'src/funcs.js', 'src/derivs.js', 'src/natpaths.js', 'src/sheets.js', 'src/formulasteps.js', 'src/parse.js', 'src/symbolic.js', 'src/invops.js', 'src/invpatterns.js', 'src/inverse.js', 'test/glsl_test.js', 'test/glsl_test_adv.js', 'test/glsl_inverse_test.js') }}
          restore-keys: |
            glsl-${{ runner.os }}-${{ steps.shkey.outputs.job }}-
      - run: node ci/glsl.js --only ${{ matrix.page }} --part ${{ matrix.part }} --tier ${{ matrix.tier || 'all' }} ${{ matrix.sections && format('--sections {0}', matrix.sections) || '' }} --ref ${{ needs.plan.outputs.reference }} ${{ env.FORCE }}
        env:
          # (a page whose browser used no CPU for 20 minutes is stuck: it fails then, not at the job's timeout)
          CMW_GLSL_STALL_MIN: '20'
          CMW_GLSL_CACHE: ${{ runner.os == 'Windows' && format('{0}/cmw-glsl-cache', runner.temp) || '' }}
      - name: Shader cache (save)
        if: always() && runner.os == 'Windows' && steps.shaders.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cmw-glsl-cache
          key: ${{ steps.shaders.outputs.cache-primary-key }}

  quality:
    name: Quality (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    # (Linux only, unless the whole gate runs)
    if: needs.plan.outputs.quality != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.quality) }}
        shard: ['1/3', '2/3', '3/3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CMW_CHROME_ARGS: ${{ startsWith(matrix.os, 'ubuntu') && '--no-sandbox' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      - run: node ci/quality.js --ref ${{ needs.plan.outputs.reference }} --shard ${{ matrix.shard }} ${{ env.FORCE || needs.plan.outputs.quality_force }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-${{ runner.os }}-${{ strategy.job-index }}
          path: .ci/quality/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Perf (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    # speed is gated on our GPU machines once they are registered; here until then, and by hand
    if: needs.plan.outputs.perf == 'true' && (vars.GPU_RUNNERS != 'true' || inputs.perf)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.perf && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      # (shared virtual machines: a timing swings both ways by more than any tolerance between two runs of the same app, so
      # timings and memory are reported with 3-fold allowances and not gated; the checks gate. Software rendering
      # settles slower than a GPU.)
      - run: node ci/perf_shard.js --shard ${{ matrix.shard }} --ref ${{ needs.plan.outputs.reference }} --reps 2 --tol-scale 3 --advisory --settle-timeout 60000 --raf-max 0 ${{ env.FORCE || needs.plan.outputs.perf_force }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-${{ runner.os }}-${{ matrix.shard }}
          path: .ci/perf/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser (${{ matrix.shard }})
    # the functional browser suites (test/*_cmd.js: the tour, constructions, touch, phone layouts, i18n, export, sound;
    # ci/browser.js), each in its own headless Chrome against this build, in shards of about 15 minutes
    # (ci/browser_shards.js). GitHub's machines render WebGL in software: the suites' timing checks are reported, not
    # gated (speed is gated by the perf suite on the GPU machines); their correctness checks gate. The renderer is Mesa's
    # lavapipe (llvmpipe behind ANGLE's Vulkan back end), which draws the app 2-4 times faster than Chrome's own
    # SwiftShader there (frames of 0.2-0.4 s instead of 0.5-2 s at 1440 x 900). The job runs on GitHub's Ubuntu 24.04
    # image, not ubuntu-latest: the layout shards gate on the renderer their baseline was made on (ci/layout_baseline.json:
    # this image's lavapipe, with its Vulkan and LLVM versions in the renderer's name), so on another image they fail
    # until a new baseline is made there; and the jobs of one run must not land on two images while ubuntu-latest moves.
    # TODO(#1507): run the job on Ubuntu 26.04 with a new layout baseline made there, and unpin it.
    needs: plan
    if: needs.plan.outputs.browser != '[]'
    strategy:
      fail-fast: false
      # (at most 8 shards of one run at a time: the hosted runners are shared by every open pull request, and a run that
      # holds all of them leaves the others half done; the full gate's 31 shards take four rounds, a tier's few run at once)
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browser) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMW_ANGLE: vulkan
      CMW_CHROME_ARGS: --no-sandbox --enable-features=Vulkan --use-vulkan=native --disable-vulkan-surface
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Mesa's Vulkan drivers (ci/lavapipe.sh): from Ubuntu's mirrors, or, when they cannot be reached, from an Actions
      # cache of the package's files, or from a fallback mirror on another domain. The cache is keyed by the runner's
      # image and the package's version in the image's lists, restored by that exact key only (files from another image
      # are never installed), and saved after an install from a mirror, Ubuntu's or the fallback, of that version only
      # (after a Mesa update, a download with refreshed lists installs a newer one; a pull request's run reads its own
      # saves and main's)
      - name: Mesa cache key
        id: mesa-key
        run: ci/lavapipe.sh --key >> "$GITHUB_OUTPUT"
      - name: Mesa cache (restore)
        id: mesa-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cmw-lavapipe-debs
          key: ${{ steps.mesa-key.outputs.key }}
      - name: Mesa's Vulkan drivers (lavapipe)
        id: mesa
        run: ci/lavapipe.sh "$RUNNER_TEMP/cmw-lavapipe-debs"
      - name: Mesa cache (save)
        if: (steps.mesa.outputs.source == 'mirror' || steps.mesa.outputs.source == 'fallback') && steps.mesa.outputs.version == steps.mesa-key.outputs.version && steps.mesa-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cmw-lavapipe-debs
          key: ${{ steps.mesa-key.outputs.key }}
      # (ci/browser.js asks the job's first Chrome for its renderer before the first suite, and fails the job when it has
      # no WebGL2: no fallback, so the suites never run on another renderer; #504 item 4, no separate gpu_probe.js start)
      - run: node ci/browser.js --shard ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-${{ matrix.shard }}
          path: .ci/browser/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Gate
    if: always()
    needs: [ready, plan, unit, glsl, quality, perf, browser]
    # (actions: read, for tier none's check of the mirrored run, #379)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    # (tier none mirroring a run still going waits for it: as long as a Gate run may take)
    timeout-minutes: ${{ needs.plan.outputs.tier == 'none' && 330 || 5 }}
    steps:
      - name: Every job the plan chose passed
        shell: bash
        env:
          TIER: ${{ needs.plan.outputs.tier }}
          WHY: ${{ needs.plan.outputs.why }}
          BROWSER: ${{ needs.plan.outputs.browser }}
          SEL_GLSL: ${{ needs.plan.outputs.glsl != '[]' }}
          SEL_QUALITY: ${{ needs.plan.outputs.quality != '[]' }}
          SEL_BROWSER: ${{ needs.plan.outputs.browser != '[]' }}
          # (the mirrored run: this PR's own on this commit, or the run of the PR above it in a stack)
          HEAD_SHA: ${{ needs.plan.outputs.mirror_sha }}
          PR: ${{ needs.plan.outputs.mirror_pr }}
          MIRROR: ${{ needs.plan.outputs.mirror }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo "tier ${TIER:-?}, plan ${{ needs.plan.result }}, unit ${{ needs.unit.result }}, glsl ${{ needs.glsl.result }}, quality ${{ needs.quality.result }}, perf ${{ needs.perf.result }}, browser ${{ needs.browser.result }}"
          printf '**Tier %s**: %s\n\nBrowser shards: %s\n' "${TIER:-?}" "${WHY:-}" "${BROWSER:-[]}" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          [ "${{ needs.plan.result }}" = success ] || { echo "::error::plan: ${{ needs.plan.result }}"; bad=1; }
          # (tier none, #379: nothing ran here, and this Gate check carries the verdict of the Gate run of this PR on the
          # same commit that the job ready found: checked again here, and waited for while it is still going, so this
          # check is never green before that run passed)
          if [ "${TIER:-}" = none ]; then
            [[ "$MIRROR" =~ ^[0-9]+$ ]] && [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::tier none without a mirrored run ($MIRROR)"; exit 1; }
            fails=0
            while :; do
              got=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MIRROR" --jq "\"\\(.status) \\(.conclusion // \"\") \\(.head_sha) \\((.pull_requests // []) | any(.number == $PR))\"") || got="error (the look-up failed)"
              echo "run $MIRROR: $got"
              case "$got" in completed*) break ;; error*) fails=$((fails + 1)); [ "$fails" -lt 5 ] || break ;; esac
              sleep 60
            done
            if [ "$got" = "completed success $HEAD_SHA true" ]; then echo "Gated by run $MIRROR of #$PR on $HEAD_SHA (it passed)." >> "$GITHUB_STEP_SUMMARY"; exit $bad; fi
            echo "::error::run $MIRROR is not a passing Gate run of #$PR on $HEAD_SHA ($got)"; exit 1
          fi
          [ "${{ needs.unit.result }}" = success ] || { echo "::error::unit: ${{ needs.unit.result }}"; bad=1; }
          # a job the plan chose passed; one it did not choose was skipped (perf may be skipped either way: the GPU
          # machines gate speed once they are registered)
          for j in glsl=${{ needs.glsl.result }}=$SEL_GLSL quality=${{ needs.quality.result }}=$SEL_QUALITY browser=${{ needs.browser.result }}=$SEL_BROWSER perf=${{ needs.perf.result }}=any; do
            IFS== read -r n r sel <<< "$j"
            if [ "$r" = success ] || { [ "$r" = skipped ] && [ "$sel" != true ]; }; then continue; fi
            echo "::error::$n: $r"; bad=1
          done
          exit $bad
