# The gate on GitHub's machines (ci/README.md): unit tests (Linux), the functional browser suites (Linux), GLSL
# conformance (Windows, macOS; only the pages whose shader code or tests changed), image quality (Linux, Windows,
# macOS), each change measured against its
# reference (the PR's base, or the previous main) on the same machine. Speed is gated on our own machines with real
# GPUs (.github/workflows/gpu-gate.yml); until they are registered (the variable GPU_RUNNERS), the paired perf suite
# runs here on Windows (desktop units and an emulated phone), and by hand (Run workflow, perf) on Windows and macOS.
# GitHub's machines are shared and render in software: their timings swing by more than any tolerance, so here the
# perf jobs gate the suite's checks (a view that does not move, a compile during a hover, a page error) and only report
# slower timings (--advisory).
# Tiers (ci/README.md, CI tiers): a pull request into another branch than main (an integration branch) runs only the
# plan and the unit tests; a pull request into main, a push to main, a run by hand and the label full-gate run it all.
name: Gate

on:
  pull_request:
    # (labeled: the label full-gate runs the whole gate on any pull request; another label restarts the run as it is)
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reference:
        description: Commit or branch the paired gates compare against (empty = the previous main commit, or the branch's merge base with main)
        required: false
        default: ''
      force:
        description: Run the paired gates even when the app (src/, build.py) did not change
        type: boolean
        default: false
      perf:
        description: Also run the perf suite here (Windows and macOS; timings advisory), as when the GPU machines are not registered
        type: boolean
        default: false
      shards:
        description: Only these perf shards (comma-separated ids of ci/perf_shards.js; empty = all)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: '1'
  FORCE: ${{ inputs.force && '--force' || '' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.tier.outputs.full }}
      reference: ${{ steps.ref.outputs.reference }}
      shards: ${{ steps.shards.outputs.shards }}
      browser: ${{ steps.browser.outputs.shards }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # (the tiers, ci/README.md: a pull request into another branch than main, e.g. an integration branch whose wave
      # PR into main runs the whole gate, runs only the plan and the unit tests, unless it carries the label full-gate)
      - id: tier
        name: Tier
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-gate') }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" != pull_request ]; then full=true why="${{ github.event_name }}"
          elif [ "$FULL_LABEL" = true ]; then full=true why="the label full-gate"
          elif [ "$BASE" = main ]; then full=true why="a pull request into main"
          else full=false why="a pull request into $BASE, not main"; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then echo "**Tier: T3 (the whole gate)**: $why." >> "$GITHUB_STEP_SUMMARY"
          else echo "**Tier: T0 (plan and unit tests)**: $why. Skipped: GLSL, quality, perf, browser (the label full-gate runs them)." >> "$GITHUB_STEP_SUMMARY"; fi
      - id: ref
        name: Reference of the paired gates
        shell: bash
        run: |
          set -eu
          case "${{ github.event_name }}" in
            pull_request) ref="${{ github.event.pull_request.base.sha }}" ;;
            push) ref="${{ github.event.before }}"
                  if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then ref=$(git rev-parse HEAD~1); fi ;;
            *) ref="${{ inputs.reference }}"
               if [ -z "$ref" ]; then
                 if [ "${{ github.ref }}" = refs/heads/main ]; then ref=$(git rev-parse HEAD~1); else ref=$(git merge-base origin/main HEAD); fi
               fi ;;
          esac
          sha=$(git rev-parse --verify "$ref^{commit}")
          echo "reference=$sha" >> "$GITHUB_OUTPUT"
          echo "Reference of the paired gates: \`$sha\` ($ref)" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet "$sha" -- src build.py; then echo "The app (src/, build.py) is unchanged since the reference: the paired gates have nothing to compare." >> "$GITHUB_STEP_SUMMARY"; fi
      - id: shards
        name: Perf shards (every unit in exactly one)
        shell: bash
        run: |
          node ci/perf_shards.js check
          if [ -n "${{ inputs.shards }}" ]; then s=$(node ci/perf_shards.js matrix --only "${{ inputs.shards }}"); else s=$(node ci/perf_shards.js matrix); fi
          echo "shards=$s" >> "$GITHUB_OUTPUT"
      - id: browser
        name: Browser shards (every suite in exactly one)
        shell: bash
        run: |
          node ci/browser_shards.js check
          echo "shards=$(node ci/browser_shards.js matrix)" >> "$GITHUB_OUTPUT"

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the construction tests' absolute speed limits were set on the development Mac
      CMW_SPEED_SCALE: '3'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/snapshots.js
      - run: node ci/unit.js
      - name: The gates' own tests
        run: python3 test/regress/test_compare.py

  glsl:
    name: GLSL (${{ matrix.os }}, ${{ matrix.page }}${{ matrix.sections && format(' {0}', matrix.sections) || '' }} ${{ matrix.part }})
    # each platform's own shader compiler (Direct3D 11's on Windows, Metal's on macOS), paired: the reference's pages run
    # on the same machine, and this change fails only where it is worse (GPUs differ near removable singularities).
    # Windows renders in software (WARP: glsl 1/8 8-24 min, inverse whole 34-35 min, adv's direct/keys/compile 34 min,
    # its chains 2 min a quarter), so glsl runs in eighths and adv in two jobs (its sections; its chains, which alone
    # split by part, are cheap);
    # macOS has a virtual GPU (a minute a page) and few machines (5 at a time), so its pages run whole. A page whose
    # shader code and tests are the same as the reference's is not run (ci/glsl.js).
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, page: glsl, part: 1/8 }
          - { os: windows-latest, page: glsl, part: 2/8 }
          - { os: windows-latest, page: glsl, part: 3/8 }
          - { os: windows-latest, page: glsl, part: 4/8 }
          - { os: windows-latest, page: glsl, part: 5/8 }
          - { os: windows-latest, page: glsl, part: 6/8 }
          - { os: windows-latest, page: glsl, part: 7/8 }
          - { os: windows-latest, page: glsl, part: 8/8 }
          - { os: windows-latest, page: adv, part: 1/1, sections: 'direct,keys,compile' }
          - { os: windows-latest, page: adv, part: 1/1, sections: main }
          - { os: windows-latest, page: inverse, part: 1/1 }
          - { os: macos-latest, page: glsl, part: 1/1 }
          - { os: macos-latest, page: adv, part: 1/1 }
          - { os: macos-latest, page: inverse, part: 1/1 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      - run: node ci/glsl.js --only ${{ matrix.page }} --part ${{ matrix.part }} ${{ matrix.sections && format('--sections {0}', matrix.sections) || '' }} --ref ${{ needs.plan.outputs.reference }} ${{ env.FORCE }}

  quality:
    name: Quality (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: ['1/3', '2/3', '3/3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CMW_CHROME_ARGS: ${{ startsWith(matrix.os, 'ubuntu') && '--no-sandbox' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      - run: node ci/quality.js --ref ${{ needs.plan.outputs.reference }} --shard ${{ matrix.shard }} ${{ env.FORCE }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-${{ runner.os }}-${{ strategy.job-index }}
          path: .ci/quality/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Perf (${{ matrix.os }}, ${{ matrix.shard }})
    needs: plan
    # speed is gated on our GPU machines once they are registered; here until then, and by hand
    if: needs.plan.outputs.full == 'true' && (vars.GPU_RUNNERS != 'true' || inputs.perf)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.perf && '["windows-latest", "macos-latest"]' || '["windows-latest"]') }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node ci/gpu_probe.js --fallback
      # (shared virtual machines: a timing swings both ways by more than any tolerance between two runs of the same app, so
      # timings and memory are reported with 3-fold allowances and not gated; the checks gate. Software rendering
      # settles slower than a GPU.)
      - run: node ci/perf_shard.js --shard ${{ matrix.shard }} --ref ${{ needs.plan.outputs.reference }} --reps 2 --tol-scale 3 --advisory --settle-timeout 60000 ${{ env.FORCE }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-${{ runner.os }}-${{ matrix.shard }}
          path: .ci/perf/
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Browser (${{ matrix.shard }})
    # the functional browser suites (test/*_cmd.js: the tour, constructions, touch, phone layouts, i18n, export, sound;
    # ci/browser.js), each in its own headless Chrome against this build, in shards of about 15 minutes
    # (ci/browser_shards.js). GitHub's machines render WebGL in software: the suites' timing checks are reported, not
    # gated (speed is gated by the perf suite on the GPU machines); their correctness checks gate. The renderer is Mesa's
    # lavapipe (llvmpipe behind ANGLE's Vulkan back end), which draws the app 2-4 times faster than Chrome's own
    # SwiftShader there (frames of 0.2-0.4 s instead of 0.5-2 s at 1440 x 900).
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.browser) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMW_ANGLE: vulkan
      CMW_CHROME_ARGS: --no-sandbox --enable-features=Vulkan --use-vulkan=native --disable-vulkan-surface
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Mesa's Vulkan drivers (lavapipe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers
      # (fails when Chrome has no WebGL2 with these flags: no fallback, so the suites never run on another renderer)
      - run: node ci/gpu_probe.js
      - run: node ci/browser.js --shard ${{ matrix.shard }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-${{ matrix.shard }}
          path: .ci/browser/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: Gate
    if: always()
    needs: [plan, unit, glsl, quality, perf, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job of the gate passed
        shell: bash
        env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -u
          echo "tier ${FULL:-?} (full gate), plan ${{ needs.plan.result }}, unit ${{ needs.unit.result }}, glsl ${{ needs.glsl.result }}, quality ${{ needs.quality.result }}, perf ${{ needs.perf.result }}, browser ${{ needs.browser.result }}"
          bad=0
          [ "${{ needs.plan.result }}" = success ] || { echo "::error::plan: ${{ needs.plan.result }}"; bad=1; }
          [ "${{ needs.unit.result }}" = success ] || { echo "::error::unit: ${{ needs.unit.result }}"; bad=1; }
          # the full gate: each of these passed (perf: or was skipped, when the GPU machines gate speed); otherwise the
          # plan skipped them
          for j in glsl=${{ needs.glsl.result }} quality=${{ needs.quality.result }} browser=${{ needs.browser.result }} perf=${{ needs.perf.result }}; do
            n=${j%%=*} r=${j#*=}
            if [ "$r" = success ]; then continue; fi
            if [ "$r" = skipped ] && { [ "$FULL" != true ] || [ "$n" = perf ]; }; then continue; fi
            echo "::error::$n: $r"; bad=1
          done
          exit $bad
