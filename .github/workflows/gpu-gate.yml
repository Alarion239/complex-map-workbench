# The gate on our own machines with real GPUs (ci/RUNNERS.md): the paired perf suite (desktop units and the emulated
# phone) with the suite's own tolerances, image quality and GLSL conformance on the Windows laptop and the Mac,
# registered as self-hosted runners with the label `gpu`. Once they are (GPU_RUNNERS), speed is gated here, not in the
# Gate on GitHub's machines.
#
# Off until the repository variable GPU_RUNNERS is 'true' (Settings > Secrets and variables > Actions > Variables), so
# nothing waits in the queue for a machine that is not registered. Every run waits for an approval in the
# `gpu-runners` environment (Settings > Environments > gpu-runners > Required reviewers), and it never runs for a pull
# request from a fork: code from outside the repository never reaches our machines.
#
# Runs: on every push to main; nightly; by hand (Actions > GPU gate > Run workflow); on a pull request from a branch of
# this repository when it has the label `gpu-gate`. The machines' own Chrome, Python and Git are used (ci/RUNNERS.md).
# By hand with mode glprof: no gates, only the app's shader link times on each machine, cold and warm (ci/glprof.js,
# issue #72; on the Mac against the reference, the sides in turn): the table in the run's summary and log, the JSON as
# the artifact glprof-<machine>. Machines windows-hosted (mode glprof only): the same on GitHub's windows-latest, whose
# Direct3D 11 renders on WARP but compiles with the same FXC on the CPU, against the reference: an A/B of link times
# while the laptop is away (#378).
name: GPU gate

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reference:
        description: Commit or branch to compare against (empty = the previous main commit, or the branch's merge base with main)
        required: false
        default: ''
      machines:
        description: 'Which machines (windows-hosted: mode glprof only, GitHub''s windows-latest, Direct3D 11 on WARP, against the reference)'
        type: choice
        options: [both, windows, mac, windows-hosted]
        default: both
      shards:
        description: Only these perf shards (comma-separated ids of ci/perf_shards.js; empty = all)
        required: false
        default: ''
      force:
        description: Run the paired gates even when the app (src/, build.py) did not change
        type: boolean
        default: false
      mode:
        description: gate (the paired gates) or glprof (the app's shader link times, cold and warm, issue #72; no gate)
        type: choice
        options: [gate, glprof]
        default: gate
      walk:
        description: 'Mode glprof: the walk (all: every example and the views; extended: also #238''s steps, the start-up minute, the gallery; quick: three examples)'
        type: choice
        options: [all, extended, quick]
        default: all
      variant:
        description: 'Mode glprof: a second side, this build with the loop guards of #206 stripped (unroll), the sides in turn (#238 item 3)'
        type: choice
        options: [none, unroll]
        default: none
      glsl:
        description: 'Mode gate: all (the GLSL and quality jobs, then perf) or skip (perf alone: on Windows a by-hand run''s GLSL tier takes about 7 hours before perf starts)'
        type: choice
        options: [all, skip]
        default: all

permissions:
  contents: read

concurrency:
  # (the nightly run in a group of its own: one that waits for a machine never holds the next push to main behind it,
  # as run 83 held 113 on 2026-10-28, #169). A pull request's or a by-hand run replaces the one before it on the same
  # branch, so a newer run is never stuck behind a lost one; pushes to main and the nightly run are kept
  group: gpu-gate-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

env:
  PYTHONUTF8: '1'
  FORCE: ${{ (inputs.force || github.event_name == 'schedule') && '--force' || '' }}

jobs:
  plan:
    name: Plan (approval)
    # never for a fork's pull request; on a pull request only with the gpu-gate label
    if: >-
      vars.GPU_RUNNERS == 'true' && (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'gpu-gate')))
    runs-on: ubuntu-latest
    environment: gpu-runners
    timeout-minutes: 10
    outputs:
      reference: ${{ steps.ref.outputs.reference }}
      shards: ${{ steps.shards.outputs.shards }}
      machines: ${{ steps.machines.outputs.machines }}
      glsl: ${{ steps.glsl.outputs.glsl }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - id: ref
        shell: bash
        run: |
          set -eu
          case "${{ github.event_name }}" in
            pull_request) ref="${{ github.event.pull_request.base.sha }}" ;;
            push) ref="${{ github.event.before }}"
                  if ! git cat-file -e "$ref^{commit}" 2>/dev/null; then ref=$(git rev-parse HEAD~1); fi ;;
            schedule) ref=$(git rev-parse HEAD~1) ;;
            *) ref="${{ inputs.reference }}"
               if [ -z "$ref" ]; then
                 if [ "${{ github.ref }}" = refs/heads/main ]; then ref=$(git rev-parse HEAD~1); else ref=$(git merge-base origin/main HEAD); fi
               fi ;;
          esac
          sha=$(git rev-parse --verify "$ref^{commit}")
          echo "reference=$sha" >> "$GITHUB_OUTPUT"
          echo "Reference of the paired gates: \`$sha\` ($ref)" >> "$GITHUB_STEP_SUMMARY"
      - id: shards
        shell: bash
        run: |
          node ci/perf_shards.js check
          if [ -n "${{ inputs.shards }}" ]; then s=$(node ci/perf_shards.js matrix --only "${{ inputs.shards }}"); else s=$(node ci/perf_shards.js matrix); fi
          echo "shards=$s" >> "$GITHUB_OUTPUT"
      - id: machines
        shell: bash
        run: |
          case "${{ inputs.machines }}" in
            windows) echo 'machines=["Windows"]' >> "$GITHUB_OUTPUT" ;;
            # (GitHub's Windows machine: shader link times only, the gates need our GPUs)
            windows-hosted)
              if [ "${{ inputs.mode }}" != glprof ]; then echo "::error::machines windows-hosted runs mode glprof only"; exit 1; fi
              echo 'machines=["Windows-hosted"]' >> "$GITHUB_OUTPUT" ;;
            mac) echo 'machines=["macOS"]' >> "$GITHUB_OUTPUT" ;;
            *) echo 'machines=["Windows","macOS"]' >> "$GITHUB_OUTPUT" ;;
          esac
      # the GLSL jobs: macOS runs its pages whole (minutes). Windows (FXC on one core: the glsl page alone took over 170
      # minutes a side on the nightly run of 2026-10-29, cut off at the job's limit) runs every chain in parts, the
      # glsl page in eighths and adv and inverse in a job each, on the nightly run and by hand; a pull request and a
      # push to main run its core tier in one job (ci/README.md, GLSL tiers)
      - id: glsl
        shell: bash
        env:
          MACHINES: ${{ steps.machines.outputs.machines }}
        run: |
          set -eu
          case "${{ github.event_name }}" in schedule|workflow_dispatch) win=all ;; *) win=core ;; esac
          node -e '
            const ms = JSON.parse(process.env.MACHINES), win = process.argv[1], jobs = [];
            for (const machine of ms) {
              if (machine !== "Windows") { jobs.push({ machine, page: "", part: "1/1", tier: "all" }); continue; }
              if (win === "core") { jobs.push({ machine, page: "", part: "1/1", tier: "core" }); continue; }
              for (let i = 1; i <= 8; i++) jobs.push({ machine, page: "glsl", part: i + "/8", tier: "all" });
              jobs.push({ machine, page: "adv", part: "1/1", tier: "all" }, { machine, page: "inverse", part: "1/1", tier: "all" });
            }
            console.log("glsl=" + JSON.stringify(jobs));' "$win" >> "$GITHUB_OUTPUT"

  # (mode glprof, by hand: ci/glprof.js on each machine instead of the gates; the table goes to the run's summary)
  glprof:
    name: Shader link times (${{ matrix.machine }} GPU)
    needs: plan
    if: inputs.mode == 'glprof'
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.machines) }}
    # (Windows-hosted: GitHub's windows-latest, where ANGLE's Direct3D 11 renders on WARP but compiles with the same
    # FXC on the CPU, so a program's link time against the reference's shows on it as on the laptop, #378)
    runs-on: ${{ fromJSON(matrix.machine == 'Windows-hosted' && '"windows-latest"' || format('["self-hosted","{0}","gpu"]', matrix.machine)) }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: matrix.machine == 'Windows-hosted'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      # (GitHub's machine renders in software, WARP: the probe says which renderer; it must still be Direct3D 11)
      - run: node ci/gpu_probe.js ${{ matrix.machine != 'Windows-hosted' && '--require-hardware' || '' }}
      # (on the Mac: this commit and the reference in turn, twice each, Chrome's Metal cache emptied before each cold
      # pass, which a fresh profile alone does not empty there (#237); Windows one side, its cold pass takes hours)
      # (walk and variant: #238; a variant is the second side, so the Mac's reference is left out then)
      # (with a variant: one round, a step timeout of 10 minutes, so both Windows sides fit the job's 300, #369)
      # (Windows-hosted: this commit and the reference, one round, the same step timeout, to fit too)
      - run: node ci/glprof.js --walk ${{ inputs.walk || 'all' }} ${{ inputs.variant == 'unroll' && '--variant unroll --step-timeout 600' || (matrix.machine == 'macOS' && format('--ref {0}', needs.plan.outputs.reference) || (matrix.machine == 'Windows-hosted' && format('--ref {0} --rounds 1 --step-timeout 600', needs.plan.outputs.reference) || '')) }} ${{ matrix.machine == 'macOS' && '--clear-metal-cache' || '' }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: glprof-${{ matrix.machine }}
          path: .ci/glprof/
          if-no-files-found: ignore
          retention-days: 30

  glsl:
    name: GLSL (${{ matrix.machine }} GPU${{ matrix.page && format(', {0} {1}', matrix.page, matrix.part) || '' }}${{ matrix.tier == 'core' && ', core' || '' }})
    needs: plan
    # (glsl skip, by hand: no GLSL and no quality jobs, the perf shards start at once; a measurement, not the full gate)
    if: inputs.mode != 'glprof' && inputs.glsl != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.glsl) }}
    runs-on: [self-hosted, '${{ matrix.machine }}', gpu]
    # Windows compiles shaders with Direct3D 11's compiler (FXC) on the CPU, about 95 % of a page's time there: cold,
    # the glsl page takes hours a side on the laptop (1/64 of it: 103-148 s; a single program of 1/8 took 12 min),
    # against 7 minutes for every page on the Mac. The shader cache (CMW_GLSL_CACHE) loads a program compiled once in
    # milliseconds, so only new shader code compiles; a run that times out keeps what it compiled, and the next one
    # goes further (#169)
    timeout-minutes: ${{ matrix.machine == 'Windows' && 240 || 90 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node ci/gpu_probe.js --require-hardware
      # (paired with the reference; on the Mac, where the tests were written, glsl and inverse also outright: adv fails
      # 304 values there, in 10 chains near removable singularities, as every release since v14 did, so it is paired only)
      # (only the pages whose shader code or tests changed; all of them nightly and with force. The job's page, part
      # and tier come from the plan: on Windows every chain only nightly and by hand, in parts; ci/README.md, GLSL tiers)
      - run: node ci/glsl.js --ref ${{ needs.plan.outputs.reference }} ${{ matrix.page && format('--only {0}', matrix.page) || '' }} --part ${{ matrix.part }} --tier ${{ matrix.tier }} ${{ matrix.machine == 'macOS' && '--absolute glsl,inverse' || '' }} ${{ env.FORCE }}
        env:
          # (a page whose browser used no CPU for 20 minutes is stuck: it fails then, not at the job's timeout)
          CMW_GLSL_STALL_MIN: '20'
          # (the machine's own folder, kept between jobs: Chrome's profile with its GPU program cache)
          CMW_GLSL_CACHE: ${{ runner.tool_cache }}/cmw-glsl-cache

  quality:
    name: Quality (${{ matrix.machine }} GPU)
    needs: [plan, glsl]
    # (!cancelled(), not always(): a failed GLSL job still lets quality run, a cancelled run stops here; always() is
    # true after a cancel too: cancelled run 41015822380 still queued its quality job on our machines)
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.mode != 'glprof' && inputs.glsl != 'skip' }}
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.machines) }}
    runs-on: [self-hosted, '${{ matrix.machine }}', gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node ci/gpu_probe.js --require-hardware
      # (the Mac also against the committed baseline and goldens, which were recorded on a Mac GPU)
      - run: node ci/quality.js --ref ${{ needs.plan.outputs.reference }} ${{ matrix.machine == 'macOS' && '--absolute' || '' }} ${{ env.FORCE }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-quality-${{ matrix.machine }}
          path: .ci/quality/
          if-no-files-found: ignore
          retention-days: 14

  perf:
    name: Perf (${{ matrix.machine }} GPU, ${{ matrix.shard }})
    needs: [plan, quality]
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.mode != 'glprof' }}
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.machines) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: [self-hosted, '${{ matrix.machine }}', gpu]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node ci/gpu_probe.js --require-hardware
      # (--table: every metric's reference -> this change in the job log, which agents can read; the artifact they cannot)
      - run: node ci/perf_shard.js --shard ${{ matrix.shard }} --ref ${{ needs.plan.outputs.reference }} --table ${{ env.FORCE }}
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gpu-perf-${{ matrix.machine }}-${{ matrix.shard }}
          path: .ci/perf/
          if-no-files-found: ignore
          retention-days: 30

  gate:
    name: GPU gate
    if: always() && needs.plan.result != 'skipped' && inputs.mode != 'glprof'
    needs: [plan, glsl, quality, perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "plan ${{ needs.plan.result }}, glsl ${{ needs.glsl.result }}, quality ${{ needs.quality.result }}, perf ${{ needs.perf.result }}"
      # (with glsl skip the GLSL and quality jobs were left out on purpose: only perf is judged then)
      - if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.perf.result == 'skipped' ||
          (inputs.glsl != 'skip' && contains(needs.*.result, 'skipped'))
        run: exit 1
