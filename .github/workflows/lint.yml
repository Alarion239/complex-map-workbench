# Lint and type check (issue #20, phase 1): ESLint, TypeScript's checker on the JavaScript, ruff on the Python.
# Report-only for now: the job lists what each tool finds in its summary and never fails on the findings, so it can
# land while the open branches merge. Once the counts reach zero (or a baseline is recorded), drop the `|| true`s.
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install ruff==0.16.9
      - name: ESLint
        run: |
          npx eslint -f json -o eslint.json || true
          node -e '
            const r = require("./eslint.json");
            let e = 0, w = 0; const rules = {};
            for (const f of r) for (const m of f.messages) { m.severity === 2 ? e++ : w++; rules[m.ruleId || "parse"] = (rules[m.ruleId || "parse"] || 0) + 1; }
            const rows = Object.entries(rules).sort((a, b) => b[1] - a[1]).map(([k, n]) => `| \`${k}\` | ${n} |`);
            console.log(["### ESLint: " + e + " errors, " + w + " warnings", "", "| rule | count |", "|---|---|", ...rows, ""].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
          npx eslint || true
      - name: TypeScript (checkJs)
        run: |
          npx tsc -p tsconfig.json > tsc.txt || true
          cat tsc.txt
          {
            echo "### TypeScript: $(grep -c 'error TS' tsc.txt) errors"
            echo
            echo '| file | errors |'
            echo '|---|---|'
            grep -oE '^[^(]+' tsc.txt | sort | uniq -c | sort -rn | awk '{ print "| `" $2 "` | " $1 " |" }'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: ruff
        run: |
          ruff check --output-format github || true
          {
            echo '### ruff'
            echo
            echo '```'
            ruff check --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
