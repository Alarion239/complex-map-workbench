# The live page (https://alarion239.github.io/complex-map-workbench/), published by GitHub Pages from a build of the
# release: push a tag v* (git tag v16.6 && git push origin v16.6), or run it by hand (Actions > Pages > Run workflow).
# Needs Settings > Pages > Source set to "GitHub Actions", and for tags, a rule of ref type Tag, `v*`, in Settings >
# Environments > github-pages > Deployment branches and tags. A tag on a commit whose message has [skip ci] starts nothing.
name: Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and a running one is never cut short
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 build.py
      - run: python3 ci/pages.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
