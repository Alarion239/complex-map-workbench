   ====================================================================== */
.pop {
  position: fixed; z-index: 30; max-width: calc(100vw - 24px);
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
  color: var(--ink); font: var(--t-body);
  animation: pop-in var(--t-med) var(--ease-out);
}
.pop[data-side="top"] { animation-name: pop-in-up; }
@keyframes pop-in { from { opacity: 0; translate: 0 -4px; } to { opacity: 1; translate: 0 0; } }
@keyframes pop-in-up { from { opacity: 0; translate: 0 4px; } to { opacity: 1; translate: 0 0; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.pop.closing { animation: fade-out var(--t-fast) linear forwards; }
@keyframes fade-out { to { opacity: 0; } }

/* menus */
.pop.menu { display: flex; flex-direction: column; min-width: 200px; width: max-content; padding: 4px; max-height: calc(100svh - 24px); overflow-y: auto; }
.mi {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; flex: 0 0 auto;
  border-radius: var(--r-2); font: var(--t-body); color: var(--ink); text-align: left; white-space: nowrap;
}
.mi:not(:disabled):hover, .mi:focus-visible, .mi.sel, .mi.active { background: var(--well); outline: none; }
.mi-ic { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: 0 0 16px; color: var(--ink-2); }
.mi-ic svg { width: 16px; height: 16px; display: block; }
.mi-label { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mi-label i { font: var(--t-math-s); }
.mi-key { margin-left: 16px; font: 400 11px/16px var(--f-mono); color: var(--faint); }
.mi:disabled { opacity: 0.4; cursor: default; }
.mi.danger:not(:disabled):hover, .mi.danger:focus-visible { background: var(--error-soft); color: var(--error); }
.mi.danger:not(:disabled):hover .mi-ic, .mi.danger:focus-visible .mi-ic { color: var(--error); }
.mi[aria-checked="true"]::after { content: ""; flex: 0 0 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-left: 8px; }
.mi.has-sub::after { content: ""; flex: 0 0 auto; width: 5px; height: 5px; margin-left: 12px; border-right: 1.5px solid var(--faint); border-bottom: 1.5px solid var(--faint); transform: rotate(-45deg); }
.msep { flex: 0 0 1px; height: 1px; margin: 4px 0; background: var(--line); }
.menu-head { padding: 6px 8px 4px; font: 600 12px/16px var(--f-ui); color: var(--muted); }
@media (pointer: coarse) { .mi { height: 36px; } }
/* examples menu */
.pop.menu.examples { width: min(400px, calc(100vw - 24px)); max-height: min(560px, calc(100svh - 64px)); }
.ex-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; flex: 0 0 auto; padding: 0 8px; border-radius: var(--r-2); text-align: left; }
.ex-item:hover, .ex-item:focus-visible, .ex-item.sel { background: var(--well); outline: none; }
.ex-thumb { display: block; flex: 0 0 48px; width: 48px; height: 32px; border: 1px solid var(--line); border-radius: var(--r-1); background: var(--plane); }
.ex-text { display: flex; flex-direction: column; min-width: 0; }
.ex-name { font: 500 13px/18px var(--f-ui); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-blurb { font: 400 11.5px/16px var(--f-ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-item.on .ex-name, .ex-item[aria-current="true"] .ex-name { color: var(--accent); }

/* swatch presets (8 squares plus Custom color) and compact-card parameter popover */
.swatch-grid { display: grid; grid-template-columns: repeat(4, 20px); gap: 6px; padding: 8px; }
.swatch-grid .swatch { width: 20px; height: 20px; cursor: pointer; }
.swatch-grid .swatch.on { outline: 1.5px solid var(--accent); outline-offset: 1.5px; }
/* compact-card parameter popover: a 32px title row (index tag + step name), then the card's parameter grid */
.pop.card-pop { padding: 0; overflow: hidden; }
.pop-title {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px 0 8px; min-width: 0;
  border-bottom: 1px solid var(--line); font: var(--t-heading); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pop-title .idx { flex: 0 0 auto; }
.pop .params { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px; width: min(256px, calc(100vw - 24px)); padding: 8px; }
.pop .params.matrix2 { margin: 0 8px; padding: 8px 7px; width: min(240px, calc(100vw - 40px)); }
.pop .params.matrix2::before, .pop .params.matrix2::after { top: 8px; }

/* Argand pad */
/* sized by its plane (192 by spec; the script may set the canvas size inline), never squeezing it out of square */
.pop.pad { width: min-content; min-width: 208px; padding: 8px; }
.pad > canvas { display: block; width: 192px; height: 192px; border-radius: var(--r-2); background: var(--plane); outline: 1px solid var(--line); outline-offset: -1px; cursor: crosshair; touch-action: none; }
.pad > .lbl { margin-top: 2px; text-wrap: pretty; }
.pad-read { margin: 6px 0 4px; font: var(--t-readout); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad .row, .pad-rows { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px; margin-top: 4px; }
.pad .scrub { display: flex; }
.pad .scrub > .pl { flex: 0 0 auto; min-width: 22px; }
.pad .scrub > .inp { flex: 1 1 auto; width: 0; height: 24px; padding: 0 6px; }

/* command palette */
.pop.palette {
  z-index: 40; display: flex; flex-direction: column; overflow: hidden; padding: 0;
  width: min(720px, calc(100vw - 24px)); max-height: min(520px, calc(100svh - 96px));
  top: 14vh; left: calc(50vw - min(360px, 50vw - 12px));
}
.pal-head { flex: 0 0 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--line); }
.pal-icon { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: 0 0 16px; color: var(--muted); }
.pal-icon svg { width: 16px; height: 16px; display: block; }
.pal-input { flex: 1 1 auto; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; outline: none; font: 400 15px/20px var(--f-ui); color: var(--ink); text-overflow: ellipsis; }
.pal-input::placeholder { color: var(--muted); opacity: 1; }
.pal-input:focus-visible { outline: none; }
.pal-ctx { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; flex: 0 0 auto; background: var(--well); border-radius: var(--r-1); font: var(--t-label); color: var(--ink-2); white-space: nowrap; }
.pal-ctx:empty { display: none; }
.pal-ctx i { font: italic 500 13px/16px var(--f-math); }
.pal-body { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.pal-list { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 4px; }
.palette > .pal-list { flex: 1 1 auto; }
.pal-group { position: sticky; top: 0; z-index: 1; padding: 8px 12px 4px; background: var(--surface); font: 600 12px/16px var(--f-ui); color: var(--muted); }
.pal-item { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; align-items: center; gap: 12px; height: 40px; padding: 0 12px; cursor: pointer; }
.pal-item:hover { background: var(--well); }
.pal-item.sel, .pal-item.sel:hover { background: var(--accent-soft); }
.pal-item.sel .pal-label { color: var(--accent); }
.pal-tex {
  min-width: 0; overflow: hidden; white-space: nowrap; font-size: 15px; color: var(--ink);
  -webkit-mask-image: linear-gradient(90deg, var(--ink) calc(100% - 12px), transparent);
  mask-image: linear-gradient(90deg, var(--ink) calc(100% - 12px), transparent);
}
.pal-tex .tex-fallback { font-size: 15px; }
.pal-tex.pal-glyph { color: var(--muted); font: var(--t-body); }
.pal-main { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.pal-label { font: 500 13px/17px var(--f-ui); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-desc { font: 400 11.5px/15px var(--f-ui); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-props { display: flex; gap: 3px; }
.pp { min-width: 11px; text-align: center; font: var(--t-caption); color: var(--faint); }
.pp.on { color: var(--good); }
.pal-empty { padding: 16px 12px; color: var(--muted); text-wrap: pretty; }
/* with no candidate there is nothing to preview */
.pal-list:has(> .pal-empty) + .pal-preview > * { visibility: hidden; }
.pal-preview { display: none; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
.pal-preview > canvas { display: block; width: 100%; height: auto; aspect-ratio: 1; background: var(--plane); border-bottom: 1px solid var(--line); }
.pal-cap { padding: 8px 12px; font: var(--t-label); color: var(--muted); }
.pal-cap i { font: italic 500 13px/16px var(--f-math); }
@media (min-width: 664px) {
  .pal-body { grid-template-columns: minmax(0, 1fr) 184px; }
  .pal-preview { display: flex; }
}
.pal-foot { flex: 0 0 28px; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--well); border-top: 1px solid var(--line); font: var(--t-label); color: var(--muted); white-space: nowrap; overflow: hidden; }

/* tooltip */
#tip {
  position: fixed; z-index: 70; left: 0; top: 0; max-width: 260px; padding: 4px 8px; pointer-events: none;
  background: var(--inverse); color: var(--inverse-ink); border-radius: var(--r-2);
  font: 400 12px/16px var(--f-ui); white-space: normal;
}
#tip .tip-key { margin-left: 8px; font: 400 11px/16px var(--f-mono); opacity: 0.7; white-space: nowrap; }
#tip .tip-desc { display: block; margin-top: 2px; opacity: 0.85; text-wrap: pretty; }
#tip i { font: italic 500 13px/16px var(--f-math); }

/* toasts */
#toastHost {
  position: fixed; z-index: 60; left: 50%; translate: -50% 0;
  bottom: calc(var(--chain-h, 272px) + max(8px, env(safe-area-inset-bottom, 0px)) + 12px);
  display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: max-content; max-width: calc(100vw - 24px);
}
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; height: 36px; max-width: 100%; padding: 0 4px 0 12px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
  font: var(--t-body); color: var(--ink); white-space: nowrap;
  animation: pop-in-up var(--t-med) var(--ease-out);
}
.toast:not(:has(.toast-act)) { padding-right: 12px; }
.toast > span { overflow: hidden; text-overflow: ellipsis; }
.toast-act { height: 28px; padding: 0 8px; border-radius: var(--r-2); font: 600 13px/18px var(--f-ui); color: var(--accent); transition: background-color var(--t-fast) var(--ease-out); }
.toast-act:hover { background: var(--accent-soft); }

/* modal (guide) */
.modal-bg { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 12px; background: var(--scrim); animation: fade-in var(--t-med) var(--ease-out); }
.modal {
  position: relative; width: min(640px, calc(100vw - 24px)); max-height: calc(100svh - 24px); overflow-y: auto; padding: 24px;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
  font: 400 13.5px/21px var(--f-ui); color: var(--ink);
  animation: pop-in var(--t-med) var(--ease-out);
}
.modal h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font: var(--t-title); color: var(--ink); }
.modal h2 .mark, .modal h2 > svg { width: 28px; height: 28px; flex: 0 0 28px; }
.modal-head { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
.modal-head > .mark { display: block; width: 28px; height: 28px; flex: 0 0 28px; }
.modal-head > h2 { margin: 0; }
.modal-foot {
  position: sticky; bottom: -24px; display: flex; justify-content: flex-end; gap: 8px;
  margin: 20px -24px -24px; padding: 12px 24px; background: var(--surface); border-top: 1px solid var(--line);
}
.modal h3 { margin: 20px 0 6px; font: var(--t-heading); color: var(--ink); }
/* article figure export */
.modal.fig-modal { width: min(1040px, calc(100vw - 24px)); }
.fig-body { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 20px; align-items: start; }
.fig-preview { position: relative; display: grid; place-items: center; min-height: 260px; max-height: min(66svh, 640px); overflow: auto; padding: 16px; background: var(--well); border: 1px solid var(--line); border-radius: var(--r-2); }
.fig-preview > img { display: block; max-width: 100%; height: auto; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 2px 10px rgba(0, 0, 0, .08); }
.fig-preview.busy > img { opacity: .55; transition: opacity var(--t-med) var(--ease-out); }
.fig-wait { font: var(--t-label); color: var(--muted); }
.fig-opts { display: grid; gap: 14px; }
.fig-row { display: grid; gap: 6px; }
.fig-l { font: var(--t-heading); color: var(--ink); }
.fig-row .seg { width: 100%; }
.fig-row .seg > button { flex: 1 1 0; }
.fig-note { font: 400 12px/18px var(--f-ui); color: var(--muted); }
@media (max-width: 760px) { .fig-body { grid-template-columns: 1fr; } }
.modal p, .modal li { max-width: 68ch; }
.modal p + p { margin-top: 8px; }
.modal ul, .modal ol { padding-left: 18px; margin: 4px 0 0; display: grid; gap: 4px; }
.modal .kbd, table.keys .kbd { height: 20px; min-width: 20px; padding: 0 5px; font: 400 11px/16px var(--f-mono); color: var(--ink-2); background: var(--surface-2); }
.modal .close, .modal > .icon-btn:first-child { position: absolute; top: 16px; right: 16px; }
/* shortcuts: key/description pairs laid out two to a row (one per row on narrow screens) */
table.keys { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); width: 100%; margin-top: 8px; font: var(--t-body); }
table.keys :is(tbody, thead, tr) { display: contents; }
table.keys :is(td, th) { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 0; min-height: 32px; padding: 5px 0; border-bottom: 1px solid var(--line); text-align: left; }
table.keys td:first-child { padding-right: 12px; white-space: nowrap; }
table.keys tr:nth-child(odd) > td:last-child { padding-right: 24px; }
table.keys th { font: var(--t-label); color: var(--muted); }
@media (max-width: 559px) {
  table.keys { grid-template-columns: max-content minmax(0, 1fr); }
  table.keys tr:nth-child(odd) > td:last-child { padding-right: 0; }
}

/* ======================================================================
   4. Breakpoints
   ====================================================================== */
/* 768px and up: panels collapse to 36px rails */
@media (min-width: 768px) {
  .layout.hide-left { --lw: 36px; }
  .layout.hide-right { --rw: 36px; }
  .layout.hide-left > .panel.left > :not(.rail), .layout.hide-right > .panel.right > :not(.rail) { display: none; }
  .layout.hide-left > .panel.left > .rail, .layout.hide-right > .panel.right > .rail { display: flex; }
  .layout.hide-left > .panel.left, .layout.hide-right > .panel.right { scrollbar-width: none; }
}
@media (max-width: 899px) { .wordmark { display: none; } }

/* 1024 to 1279: the left panel docks at 240px; the right panel keeps a 36px rail column, and showing it
   (the hide-right state that the header toggle, the rail chevron and ] flip) opens it as a 288px drawer. */
@media (min-width: 1024px) and (max-width: 1279px) {
  .layout { --lw: 240px; --rw: 36px; }
  .layout.hide-left { --lw: 36px; }
}
/* 768 to 1023: both panels keep 36px rail columns; showing either opens it as a drawer */
@media (min-width: 768px) and (max-width: 1023px) {
  .layout { --lw: 36px; --rw: 36px; }
}
/* drawers: level 3, absolute over the stage, sliding in over --t-med */
@media (min-width: 768px) and (max-width: 1279px) {
  .layout:not(.hide-right) > .panel.right {
    position: absolute; z-index: 20; top: 0; bottom: 0; right: 0; width: 288px;
    background: var(--surface); border-color: var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
    animation: drawer-r var(--t-med) var(--ease-out);
  }
}
@media (min-width: 768px) and (max-width: 1023px) {
  .layout:not(.hide-left) > .panel.left {
    position: absolute; z-index: 20; top: 0; bottom: 0; left: 0; width: 252px;
    background: var(--surface); border-color: var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
    animation: drawer-l var(--t-med) var(--ease-out);
  }
}
@keyframes drawer-r { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes drawer-l { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Phone (< 768): single column, 16px gutters, no horizontal page scroll ---------- */
@media (max-width: 767px) {
  :root { --ruler: 14px; }
  html, body { height: auto; }
  html { scroll-padding-top: 52px; scroll-padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  body { overflow-x: clip; }
  #app {
    display: block; height: auto; min-height: 100svh; overflow-x: clip;
    padding-top: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px) + 16px);
  }
  /* header: mark, "Map Workbench", Undo, Redo, and a more menu */
  .top { position: sticky; top: 0; z-index: 15; gap: 4px; background: var(--bg); margin: 0 -4px; padding: 0 4px; }
  .wordmark { display: block; font-size: 14px; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .wm-pre, .hdiv, .top > .spacer { display: none; }
  .hdr-more { display: inline-grid !important; }
  .hdr-menu:not(:popover-open) { display: none; }
  .hdr-menu:popover-open {
    position: fixed; inset: auto; top: calc(44px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); left: auto; bottom: auto;
    display: flex; flex-direction: column; width: min(240px, calc(100vw - 24px)); margin: 0; padding: 4px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3); color: var(--ink);
    animation: pop-in var(--t-med) var(--ease-out);
  }
  .hdr-menu::backdrop { background: transparent; }
  .top .hdr-menu > button:is(.btn, .icon-btn, .cmd-field) {
    display: flex; align-items: center; justify-content: flex-start; gap: 8px; flex: 0 0 auto; width: 100%; min-width: 0; max-width: none; height: 36px; margin: 0; padding: 0 8px;
    background: transparent; border: 0; border-radius: var(--r-2); box-shadow: none;
    font: var(--t-body); color: var(--ink); text-align: left;
  }
  .top .hdr-menu > button:is(.btn, .icon-btn, .cmd-field):is(:hover, :focus-visible) { background: var(--well); outline: none; }
  .hdr-menu > button .ic-slot { color: var(--ink-2); }
  .hdr-menu .mlabel { display: inline; flex: 1 1 auto; }
  .hdr-menu .exlabel, .hdr-menu .cmd-field .kbd, .hdr-menu #examplesBtn .ic-slot { display: none; }
  .hdr-menu #examplesBtn::before { content: ""; width: 16px; height: 16px; flex: 0 0 16px; }
  .hdr-menu > #toggleLeft { border-top: 1px solid var(--line); border-radius: 0; margin-top: 4px; padding-top: 4px; height: 40px; }
  /* the command field keeps its desktop margin (an id rule) and 14px icon otherwise: align it with the other rows */
  .top .hdr-menu > #cmdBtn { margin: 0; }
  .hdr-menu #cmdBtn .ic-slot, .hdr-menu #cmdBtn .ic-slot > svg { width: 16px; height: 16px; flex-basis: 16px; color: var(--ink-2); }
  .hdr-menu #cmdBtn .cmd-text { color: var(--ink); }
  .hdr-menu:popover-open { overflow-x: hidden; }
  .hdr-menu > [aria-pressed="true"]::after { content: ""; width: 8px; height: 4px; margin-right: 2px; border-left: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateY(-2px) rotate(-45deg); }

  /* flow: planes, chain, region disclosures, guarantees */
  .layout { display: flex; flex-direction: column; gap: 12px; overflow: visible; }
  .stage { order: -1; display: flex; flex-direction: column; gap: 12px; }
  .panes, .panes.solo-L, .panes.solo-R { display: flex; flex-direction: column; gap: 8px; }
  .panes.solo-L > #paneR, .panes.solo-R > #paneL { display: grid; }
  .gutter { display: none !important; }
  .pane { height: min(calc(100vw - 32px), 46svh); flex: 0 0 auto; }
  .pane-head { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .pane-head::-webkit-scrollbar { display: none; }
  .options { max-width: calc(100% - 56px); }
  .options .seg > button { padding: 0 6px; }
  .options select.sel { padding-right: 20px; }
  .options.transport, .options:has(> .transport) { right: 52px; }
  /* collapsed mode options: one 32px sliders button with a 44px hit area */
  .options.collapsed { padding: 0; min-height: 0; }
  .options.collapsed > .opts-btn { width: 32px; height: 32px; }
  .options > .opts-btn::after { content: ""; position: absolute; inset: -6px; }
  .vbtn { width: 30px; height: 31px; }
  .vbtn::after { content: ""; position: absolute; inset: -6px; }
  .chip.readout { max-width: calc(100% - 16px); }
  .plot:has(> .legend-chip:not([hidden])) > .chip.readout { max-width: calc(100% - 16px); }
  .legend-chip { top: 40px; }
  .plot:has(> .legend-chip:not([hidden], .collapsed)) > .empty-chip { top: 120px; }

  /* chain: its own strip */
  .pipe-wrap { display: block; }
  .pipe-head { flex-wrap: wrap; row-gap: 4px; padding: 6px 12px; min-height: 36px; white-space: normal; }
  .pipe-head .compose { flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
  .pipe-head .grow { display: none; }
  .pipeline { scroll-snap-type: x mandatory; }
  .card { flex-basis: min(240px, 78vw); width: min(240px, 78vw); }
  .card.region-card { flex-basis: min(200px, 70vw); width: min(200px, 70vw); }
  .pipeline.compact .card { flex-basis: min(200px, 70vw); width: min(200px, 70vw); }

  /* panels as disclosures */
  .panel { overflow: visible; }
  .panel.left { order: 0; display: flex; flex-direction: column; gap: 8px; background: none; border: 0; border-radius: 0; }
  .panel.right { order: 1; }
  .panel.left > .rail { display: none; }
  details.psec { padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3); }
  details.psec::details-content { content-visibility: revert; display: revert; }
  details.psec > summary { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; pointer-events: auto; cursor: pointer; }
  details.psec > summary h2 { flex: 1 1 auto; margin: 0; }
  details.psec > summary::after { content: ""; flex: 0 0 auto; width: 6px; height: 6px; margin: 0 4px 3px 4px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); transition: transform var(--t-med) var(--ease-out); }
  details.psec[open] > summary::after { transform: translateY(3px) rotate(-135deg); }
  details.psec[open] > summary { border-bottom: 1px solid var(--line); }
  details.psec > .psec-body { padding: 12px; }
  .layout.hide-left > .panel.left > details.psec { display: none; }
  .layout.hide-left > .panel.left > .rail { display: flex; }

  /* guarantees: the rail becomes the summary row with the 8 lamps */
  .panel.right { display: block; }
  .panel.right > .rail {
    display: flex; flex-direction: row; align-items: center; gap: 12px; width: 100%; min-height: 44px; height: 44px; padding: 0 6px 0 12px;
  }
  .panel > .rail .rail-label { order: 1; margin: 0; padding: 0; writing-mode: horizontal-tb; transform: none; font: var(--t-heading); color: var(--ink); }
  .panel > .rail .rail-lamps { order: 2; flex-direction: row; padding: 0; }
  .panel > .rail .rail-count { order: 2; }
  .panel > .rail .rail-tools { display: none; }
  .panel > .rail .rail-open { order: 3; margin-left: auto; }
  .panel > .rail .rail-open > :is(.ic-slot, svg) { transform: rotate(-90deg); transition: transform var(--t-med) var(--ease-out); }
  .layout:not(.hide-right) > .panel.right > .rail { border-bottom: 1px solid var(--line); }
  .layout:not(.hide-right) > .panel.right > .rail .rail-open > :is(.ic-slot, svg) { transform: rotate(90deg); }
  .layout.hide-right > .panel.right > #propsPanel { display: none; }
  /* the summary row's chevron already folds the section; the docked panel's own hide button is redundant here */
  #propsPanel h2 > .icon-btn[aria-label="Hide guarantees"] { display: none; }
  .panel.left > .rail { border: 1px solid var(--line); border-radius: var(--r-3); background: var(--panel); }

  /* bottom toolbar: 52px plus the safe area, Select Point Circle Disc Rectangle Polygon More */
  #secDraw {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 2px;
    height: calc(52px + env(safe-area-inset-bottom, 0px));
    padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
    background: var(--panel); border: 0; border-top: 1px solid var(--line-strong); border-radius: 0;
  }
  #secDraw > h2 { display: none; }
  #secDraw > .tools { display: flex; flex: 1 1 auto; gap: 2px; min-width: 0; }
  #secDraw > .tools > .tool { display: none; flex: 1 1 0; width: auto; }

  #secDraw > .tools > .tool.on { display: block; }

  .tool-more { display: block; flex: 1 1 0; min-width: 0; max-width: 60px; }
  .tool-more > summary {
    position: relative; display: block; height: 44px; list-style: none; cursor: pointer;
    border: 1px solid transparent; border-radius: var(--r-2); color: var(--ink-2);
  }
  .tool-more > summary::-webkit-details-marker { display: none; }

  .tool-more[open] > summary { background: var(--well); color: var(--ink); }
  /* More: bottom sheet, all keys in 5 columns, max 80svh */
  #secDraw:has(.tool-more[open]) {
    height: auto; max-height: 80svh; overflow-y: auto; flex-direction: column; align-items: stretch; gap: 8px;
    padding-top: 12px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));

  }
  #secDraw:has(.tool-more[open]) > .tools { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  #secDraw:has(.tool-more[open]) > .tools > .tool { display: block; height: 52px; }
  #secDraw:has(.tool-more[open]) > .tools > .tool > svg { top: 8px; }
  #secDraw:has(.tool-more[open]) > .tool-more { order: 2; }
  #secDraw:has(.tool-more[open]) > .tool-more { max-width: none; flex: 0 0 auto; }
  #secDraw:has(.tool-more[open]) > .tool-more > summary { height: 40px; }
  #secDraw:has(.tool-more[open]) > .tool-more > summary > .ic-slot { display: none; }
  #secDraw:has(.tool-more[open]) > .tool-more > summary > .tm-label { top: 50%; bottom: auto; translate: 0 -50%; font: var(--t-label); }

  #toastHost { bottom: calc(52px + env(safe-area-inset-bottom, 0px) + 12px); }
  .pop.palette {
    top: auto !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100% !important; max-width: none; height: 85svh; max-height: 85svh;

  .pal-props { display: none; }
  .pal-foot, .pal-head > .kbd { display: none; }
  .modal-bg { align-items: end; padding: 12px 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
  .modal { padding: 20px 16px; }
}
@media (max-width: 767px) and (pointer: coarse) {

/* ======================================================================
   7. Reduced motion: durations 0, opacity fades capped at 80ms, LED steady
   ====================================================================== */
@media (prefers-reduced-motion: reduce) {
  :root { --t-fast: 0ms; --t-med: 0ms; --t-slow: 0ms; --t-view: 0ms; --t-hom: 0ms; }
  *, *::before, *::after { transition-duration: 0ms !important; scroll-behavior: auto !important; }
  .led.busy { animation: none; opacity: 1; }
  .hairline::before { animation: none; width: 100%; opacity: 0.6; }
  .pop, .toast, .modal, .modal-bg, .hdr-menu:popover-open { animation: fade-in 80ms linear !important; }
  .layout.drawer-right > .panel.right, .layout.drawer-left > .panel.left { animation: fade-in 80ms linear !important; }

  .seg::before { transition: none; }
