<!doctype html><html><head><meta charset="utf-8"><title>uc</title></head><body>
<pre id="out">pending</pre>
<script src="../src/gl.js"></script>
<script>
(function () {
  const out = [];
  try {
    const cnv = document.createElement('canvas'); cnv.width = 1032; cnv.height = 1032;
    if (!GLR.init(cnv)) { document.getElementById('out').textContent = 'NO WEBGL2'; return; }
    const gl = cnv.getContext('webgl2');
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    out.push('renderer: ' + (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
    const W = 1032, H = 1032, dpr = 2;
    const c2 = document.createElement('canvas'); c2.width = W; c2.height = H; const g = c2.getContext('2d', { willReadFrequently: true });
    function shot(s, unit, cx, cy) {
      GLR.begin(W, H);
      GLR.drawGrid({ view: { cx, cy, s }, dpr, unit, unitAlpha: 0.55, axis: [0.18, 0.24, 0.28] });
      g.clearRect(0, 0, W, H); GLR.blit(g);
      return g.getImageData(0, 0, W, H).data;
    }
    for (const [cx, cy] of [[0.6, 0.8], [1, 0]]) for (const s of [60, 3e3, 3e4, 3e5, 1e6, 3e6, 1e7, 3e7, 1e8, 1e9]) {
      const a = shot(s, true, cx, cy), b = shot(s, false, cx, cy);
      let diff = 0, diffNear = 0, diffFar = 0, near = 0, maxFar = 0;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        const d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
        const wx = cx + (x + 0.5 - W / 2) / (s * dpr), wy = cy - (y + 0.5 - H / 2) / (s * dpr);
        const dist = Math.abs(Math.hypot(wx, wy) - 1) * s * dpr;
        if (dist < 1) near++;
        if (d > 20) { diff++; if (dist < 1.5) diffNear++; else if (dist > 3) { diffFar++; maxFar = Math.max(maxFar, dist); } }
      }
      out.push(JSON.stringify({ c: [cx, cy], s, pixelsOnTrueLine: near, inkPixels: diff, inkOnLine: diffNear, inkOff: diffFar, maxOffDist: +maxFar.toFixed(1) }));
    }
  } catch (e) { out.push('ERR ' + e.stack); }
  document.getElementById('out').textContent = out.join('\n');
})();
</script></body></html>
