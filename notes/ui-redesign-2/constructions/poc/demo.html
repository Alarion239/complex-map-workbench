/* Complex Map Workbench: "Calibrated bench" (notes/DESIGN_SPEC.md is the source of truth).
   Sections: 2 tokens, 3 type, 4 frame and breakpoints, 5 components, motion. */

/* ======================================================================
   2. Tokens (verbatim from the spec)
   ====================================================================== */
:root {
  color-scheme: light;
  /* surfaces */
  --bg: #E3E8EA; --panel: #F1F4F5; --surface: #FFFFFF; --surface-2: #F7F9FA; --well: #E9EEF0;
  --overlay: #FFFFFFEB; --inverse: #121A20; --inverse-ink: #FFFFFF;
  /* text: ink 15.9:1, ink-2 8.0:1, muted 5.5:1 on panel; faint 2.7:1 is disabled/decorative only */
  --ink: #121A20; --ink-2: #3E4C56; --muted: #56646E; --faint: #8A969E;
  --line: #D2DADE; --line-strong: #B3BEC4;
  /* accent: petrol, 5.6:1 on panel; white on it 6.1:1 */
  --accent: #0A6A87; --accent-hover: #075A73; --accent-soft: #DDEFF4; --accent-ink: #FFFFFF;
  --good: #1B7A47; --good-soft: #DFF1E6; --warn: #8F5408; --warn-soft: #FAEDD7; --error: #B4231A; --error-soft: #FBE5E2;
  /* plane */
  --plane: #FCFDFD; --grid-minor: #E2EEF2; --grid-medium: #D3E6ED; --grid-major: #B5D4E0;
  --axis: #2E3D47; --axis-label: #4A606C; --ruler-tick: #3E4C56;
  --cut: #CC3311; --pole: #A0153E; --zero: #121A20; --probe: #121A20; --halo: #FCFDFD; --fov: #2E3D47;
  --dc-line: #FFFFFF; --dc-casing: #0B1114;
  /* landscape and sphere */
  --land-top: #F5F8F9; --land-bottom: #DCE4E7; --land-floor: #FAFCFC; --land-box: #B3BEC4;
  --land-mod-line: #18232A; --land-arg-line: #FFFFFF; --plaster: #ECEEEC; --land-shadow: #2E3D47;
  --hemi-sky: #E6EEF4; --hemi-ground: #8C9296;
  /* shape inks (theme-independent base) and theme-dependent edge/alt shades */
  --c1: #3B6FD4; --c2: #CD821A; --c3: #12938F; --c4: #BC4E98; --c5: #31983D; --c6: #7F56C4; --c7: #888D22; --c8: #607183;
  --c1-edge: #093B9B; --c2-edge: #8A560B; --c3-edge: #0A5C5A; --c4-edge: #831466;
  --c5-edge: #086119; --c6-edge: #50218C; --c7-edge: #575A08; --c8-edge: #324152;
  --c1-alt: #8CABE5; --c2-alt: #F0C598; --c3-alt: #8EC3C0; --c4-alt: #DD9DC5;
  --c5-alt: #94C795; --c6-alt: #AE9CDA; --c7-alt: #BEC390; --c8-alt: #9CA6B1;
  --stretch-shrink: #2E69B2; --stretch-grow: #D79628; --stretch-mid: #E9F0F2;
  /* canvas opacities (unitless) */
  --halo-a: 0.85; --fov-a: 0.55; --cursor-a: 0.35; --dc-line-a: 0.22; --dc-axis-a: 0.70; --land-shadow-a: 0.30;
  /* elevation */
  --shadow-1: 0 1px 2px #121A201A;
  --shadow-3: 0 10px 28px #121A2029, 0 2px 6px #121A2014;
  --scrim: #121A205C;
  /* type */
  --f-ui: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "B612 Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-math: "STIX Two Text", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
  --t-micro: 400 10px/12px var(--f-mono);
  --t-caption: semi-condensed 600 11px/14px var(--f-ui);
  --t-label: 500 12px/16px var(--f-ui);
  --t-body: 400 13px/18px var(--f-ui);
  --t-heading: 600 13px/18px var(--f-ui);
  --t-readout: 400 11.5px/16px var(--f-mono);
  --t-math-s: italic 500 13px/18px var(--f-math);
  --t-math: italic 500 15px/20px var(--f-math);
  --t-wordmark: semi-expanded 640 14.5px/20px var(--f-ui);
  --t-title: 600 19px/24px var(--f-ui);
  /* spacing, radii, control heights */
  --s-1: 2px; --s-2: 4px; --s-3: 6px; --s-4: 8px; --s-5: 12px; --s-6: 16px; --s-7: 20px; --s-8: 24px; --s-9: 32px;
  --r-1: 2px; --r-2: 3px; --r-3: 4px; --r-4: 6px;
  --h-xs: 20px; --h-sm: 24px; --h-md: 28px; --h-lg: 32px; --h-xl: 44px;
  /* motion */
  --t-fast: 80ms; --t-med: 160ms; --t-slow: 240ms; --t-view: 220ms; --t-hom: 480ms;
  --ease-out: cubic-bezier(0.2, 0, 0, 1); --ease-std: cubic-bezier(0.3, 0, 0.2, 1); --ease-inout: cubic-bezier(0.65, 0, 0.35, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #12191E; --panel: #172026; --surface: #1D282F; --surface-2: #23303A; --well: #121A1F;
    --overlay: #1D282FEB; --inverse: #E3EAEE; --inverse-ink: #12191E;
    --ink: #E3EAEE; --ink-2: #B4C1C9; --muted: #91A1AB; --faint: #5E6E78; --line: #26333B; --line-strong: #36474F;
    --accent: #52B7D3; --accent-hover: #78C9E0; --accent-soft: #12313B; --accent-ink: #061216;
    --good: #4BC28A; --good-soft: #112A1F; --warn: #E3A23E; --warn-soft: #2D2211; --error: #FF7262; --error-soft: #35181A;
    --plane: #0D1317; --grid-minor: #14212A; --grid-medium: #1A2D38; --grid-major: #21404F;
    --axis: #94A8B3; --axis-label: #8197A3; --ruler-tick: #B4C1C9;
    --cut: #FF6B3D; --pole: #FF5A85; --zero: #E3EAEE; --probe: #E3EAEE; --halo: #0D1317; --fov: #94A8B3;
    --dc-line: #FFFFFF; --dc-casing: #05090B;
    --land-top: #1A252C; --land-bottom: #0A1013; --land-floor: #10181D; --land-box: #36474F;
    --land-mod-line: #05090B; --land-arg-line: #FFFFFF; --plaster: #C9CFD2; --land-shadow: #000000;
    --hemi-sky: #9FB2C0; --hemi-ground: #3A3F44;
    --c1-edge: #79A7FA; --c2-edge: #FBBD78; --c3-edge: #74C5C1; --c4-edge: #EA8EC9;
    --c5-edge: #7ECA80; --c6-edge: #AF91EC; --c7-edge: #BCC174; --c8-edge: #95A3B3;
    --c1-alt: #1F4591; --c2-alt: #925B0A; --c3-alt: #096260; --c4-alt: #802E67;
    --c5-alt: #166721; --c6-alt: #523284; --c7-alt: #5D600A; --c8-alt: #3A4654;
    --stretch-mid: #2D3436;
    --halo-a: 0.85; --fov-a: 0.60; --cursor-a: 0.40; --dc-line-a: 0.22; --dc-axis-a: 0.70; --land-shadow-a: 0.55;
    --shadow-1: 0 1px 2px #00000066; --shadow-3: 0 12px 32px #00000080, 0 2px 6px #00000059; --scrim: #0000008C;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12191E; --panel: #172026; --surface: #1D282F; --surface-2: #23303A; --well: #121A1F;
  --overlay: #1D282FEB; --inverse: #E3EAEE; --inverse-ink: #12191E;
  --ink: #E3EAEE; --ink-2: #B4C1C9; --muted: #91A1AB; --faint: #5E6E78; --line: #26333B; --line-strong: #36474F;
  --accent: #52B7D3; --accent-hover: #78C9E0; --accent-soft: #12313B; --accent-ink: #061216;
  --good: #4BC28A; --good-soft: #112A1F; --warn: #E3A23E; --warn-soft: #2D2211; --error: #FF7262; --error-soft: #35181A;
  --plane: #0D1317; --grid-minor: #14212A; --grid-medium: #1A2D38; --grid-major: #21404F;
  --axis: #94A8B3; --axis-label: #8197A3; --ruler-tick: #B4C1C9;
  --cut: #FF6B3D; --pole: #FF5A85; --zero: #E3EAEE; --probe: #E3EAEE; --halo: #0D1317; --fov: #94A8B3;
  --dc-line: #FFFFFF; --dc-casing: #05090B;
  --land-top: #1A252C; --land-bottom: #0A1013; --land-floor: #10181D; --land-box: #36474F;
  --land-mod-line: #05090B; --land-arg-line: #FFFFFF; --plaster: #C9CFD2; --land-shadow: #000000;
  --hemi-sky: #9FB2C0; --hemi-ground: #3A3F44;
  --c1-edge: #79A7FA; --c2-edge: #FBBD78; --c3-edge: #74C5C1; --c4-edge: #EA8EC9;
  --c5-edge: #7ECA80; --c6-edge: #AF91EC; --c7-edge: #BCC174; --c8-edge: #95A3B3;

  --halo-a: 0.85; --fov-a: 0.60; --cursor-a: 0.40; --dc-line-a: 0.22; --dc-axis-a: 0.70; --land-shadow-a: 0.55;
  --shadow-1: 0 1px 2px #00000066; --shadow-3: 0 12px 32px #00000080, 0 2px 6px #00000059; --scrim: #0000008C;

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: var(--t-body); font-variant-numeric: tabular-nums lining-nums; }
:root[data-theme="dark"] body { -webkit-font-smoothing: antialiased; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { -webkit-font-smoothing: antialiased; } }
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* keyboard focus scrolls a control fully into view, ring included, inside scrolling panels */
:focus-visible { scroll-margin: 8px; }

/* Derived aliases (not new colors): the selected segment is --surface in light and --surface-2 in dark. */
:root { --seg-on: var(--surface); --ruler: 18px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --seg-on: var(--surface-2); } }
:root[data-theme="dark"] { --seg-on: var(--surface-2); }

/* ======================================================================
   Base
   ====================================================================== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* set for one style flush while the theme switches, so the chrome changes in the same frame as the canvases */
.no-trans *, .no-trans *::before, .no-trans *::after { transition: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; margin: 0; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
h1, h2, h3, h4, p, ul, ol { margin: 0; }
::selection { background: var(--accent-soft); color: var(--ink); }
i, var, .math { font-family: var(--f-math); font-style: italic; font-weight: 500; }
sub, sup { font-size: 0.72em; line-height: 0; position: relative; vertical-align: baseline; }
sub { bottom: -0.25em; }
sup { top: -0.45em; }
.mono { font: var(--t-readout); }
.grow, .spacer { flex: 1 1 auto; min-width: 0; }
.ic { display: block; flex: 0 0 auto; }
.ic-slot { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: 0 0 16px; }
.ic-slot > svg { display: block; width: 16px; height: 16px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.lbl { font: var(--t-label); color: var(--muted); }
.lbl.note, .note-line { font: var(--t-label); color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.count { font: var(--t-label); color: var(--muted); }
.err, .err-line { font: 400 11.5px/16px var(--f-ui); color: var(--error); }

/* MathJax: sizes per context are set on the containers below. The fallback is STIX italic at the
   same size with a one-line min-height so nothing jumps when MathJax arrives. */
mjx-container[jax="SVG"] { direction: ltr; }
mjx-container[jax="SVG"][display="true"] { margin: 0 !important; text-align: left !important; }
.tex-fallback { font-family: var(--f-math); font-style: italic; font-weight: 500; white-space: nowrap; color: inherit; display: inline-block; min-height: 1.25em; }

/* ======================================================================
   4. Frame
   ====================================================================== */
#app {
  height: 100%;
  display: grid; grid-template-rows: 44px minmax(0, 1fr);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.layout {
  --lw: 252px; --rw: 288px;
  position: relative;
  display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); gap: 8px;
  min-width: 0; min-height: 0; overflow-x: clip;
}
.layout > * { min-width: 0; min-height: 0; grid-row: 1; }
/* explicit columns: a panel lifted out as a drawer must not let the stage slide into its track */
.layout > .panel.left { grid-column: 1; }
.layout > .stage { grid-column: 2; }
.layout > .panel.right { grid-column: 3; }

/* ---------- 5.1 Header ---------- */
.top { display: flex; align-items: center; gap: 8px; height: 44px; min-width: 0; reading-flow: flex-visual; }
.top > * { flex: 0 0 auto; }
.top .mark { order: 1; display: block; width: 22px; height: 22px; }
.wordmark { order: 2; font: var(--t-wordmark); color: var(--ink); white-space: nowrap; margin-left: 2px; }
.hdiv { order: 3; width: 1px; height: 20px; background: var(--line-strong); margin: 0 2px; }
#examplesBtn { order: 4; }
/* a full bar (a long example name at 1024px ran it past the edge): the search field gives way first, down to its own
   minimum, then the Examples button, its name ending in an ellipsis */
@media (min-width: 1024px) { #examplesBtn { flex-shrink: 1; min-width: 0; } #cmdBtn { flex-shrink: 1000; } }
#undoBtn { order: 5; }
#redoBtn { order: 6; }
.top > .spacer { order: 7; flex: 1 1 auto; }
#cmdBtn { order: 8; }
#toggleLeft { order: 9; }
#toggleRight { order: 10; }
#exportBtn { order: 11; }
#themeBtn { order: 12; }
#helpBtn { order: 13; }
/* Sound (notes/sound/DESIGN.md §2.1): a split button between Theme and Guide, its settings popover, and on a phone
   the speaker in the bar while sound is on (one tap silences it) */
#soundBtn, #soundMore { order: 12; }
.top .snd-btn { display: inline-flex; align-items: center; gap: 5px; width: auto; padding: 0 6px 0 6px; border-radius: var(--r-2) 0 0 var(--r-2); font: var(--t-label); }
.top .snd-caret { width: 17px; margin-left: -8px; border-radius: 0 var(--r-2) var(--r-2) 0; }
.top .snd-caret::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1px; background: var(--line); }
.top .snd-caret .ic-slot svg { width: 11px; height: 11px; }
.snd-ic, .snd-ic svg { display: block; width: 16px; height: 16px; }
.top > .snd-ph { display: none; }
/* room for it on tablets: below 1340 px the speaker drops its label (as the view switch and Deformation do below
   1280); from 768 to 1023 the command field narrows and drops its ⌘K hint, and the wordmark hides from 900 too (the
   bar overflowed there before, by 44 px at 900) */
@media (min-width: 768px) and (max-width: 1339px) { .top .snd-btn .slbl { display: none; } .top .snd-btn { padding: 0 6px; } }
@media (min-width: 768px) and (max-width: 1023px) { .top .cmd-field { min-width: 112px; } .top .cmd-field .kbd { display: none; } .top > .wordmark { display: none; } }
.snd-pop {
  position: fixed; z-index: 45; top: 48px; right: 12px; width: 330px; max-width: calc(100vw - 32px); max-height: calc(100vh - 60px); overflow-y: auto;
  padding: 10px 14px 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
  color: var(--ink); font: var(--t-body); animation: pop-in var(--t-med) var(--ease-out);
}
.snd-row { display: flex; align-items: center; gap: 10px; min-height: 32px; }
.snd-row > span:first-child { flex: 1 1 auto; font: var(--t-label); }
.snd-main > span:first-child { font: var(--t-heading); }
.snd-switch { position: relative; flex: none; width: 34px; height: 20px; margin: 0; appearance: none; -webkit-appearance: none; background: var(--line-strong); border-radius: 10px; cursor: pointer; transition: background-color var(--t-fast) var(--ease-out); }
.snd-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-1); transition: transform var(--t-fast) var(--ease-out); }
.snd-switch:checked { background: var(--accent); }
.snd-switch:checked::after { transform: translateX(14px); }
.snd-switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.snd-row input[type=range] { width: 150px; min-width: 0; flex: 0 1 150px; accent-color: var(--accent); }
.snd-row output { width: 40px; text-align: right; font: var(--t-readout); color: var(--ink-2); }
.snd-tiers { margin: 6px 0 2px; padding: 6px 0 0; border: 0; border-top: 1px solid var(--line); min-width: 0; }
.snd-tiers legend { padding: 0; margin-bottom: 2px; font: var(--t-caption); color: var(--muted); }
.snd-chk { display: flex; gap: 9px; align-items: flex-start; padding: 6px 0; cursor: pointer; }
.snd-chk input { flex: none; width: 15px; height: 15px; margin: 1px 0 0; accent-color: var(--accent); }
.snd-chk b { display: block; font: var(--t-label); color: var(--ink); }
.snd-chk small { display: block; font: 400 11.5px/15px var(--f-ui); color: var(--muted); }
.snd-chk small i { font-family: var(--f-math); }
.snd-chk.sub { padding: 0 0 6px 24px; }
.snd-offnote { margin: 4px 0 2px; font: var(--t-label); color: var(--ink-2); }
.snd-fine { margin: 6px 0 0; font: 400 11px/15px var(--f-ui); color: var(--muted); }
.snd-fine.mono { font: var(--t-micro); }
.plot > canvas.overlay:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.hdr-more { order: 14; display: none !important; }
/* the views (merged-views.md): the view switch and the Deformation toggle sit between the two spacers, in the middle
   of the bar; below 1280px they are icons (their tooltips name them) */
.top > .vsw, .top > .defbtn, .top > .spacer2 { order: 7; }
.top > .seg.vsw { flex: 0 0 auto; overflow: visible; }
.vsw i { font: italic 500 14px/1 var(--f-math); }
.vsw .arr { font: var(--t-label); }
.phbtn[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.phbtn[aria-disabled="true"]:hover { color: var(--muted); }
@media (max-width: 1279px) {
  .top > .vsw > button > span, .top > .defbtn > span { display: none; }
  .top > .vsw > button { padding: 0 8px; }
  .top > .defbtn { padding: 0 8px; }
}
.hdr-menu { display: contents; }
.mlabel { display: none; }
.menu-btn { max-width: 240px; gap: 4px; padding: 0 6px 0 8px; }
.menu-btn .exlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.menu-btn .ic-slot { color: var(--faint); }
.cmd-field {
  flex: 0 1 240px; width: 240px; min-width: 150px; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 8px;
  background: var(--well); border: 1px solid var(--line); border-radius: var(--r-2);
  font: var(--t-body); color: var(--muted); text-align: left; white-space: nowrap;
  transition: border-color var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out);
}
.cmd-field:hover { border-color: var(--line-strong); }
.cmd-field .ic-slot { width: 14px; height: 14px; flex-basis: 14px; color: var(--muted); }
.cmd-field .ic-slot > svg { width: 14px; height: 14px; }
.cmd-text { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cmd-field .kbd { background: var(--surface); }
#cmdBtn { margin: 0 4px 0 8px; }

/* ---------- Panels ---------- */
.panel {
  position: relative; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3);
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
}
.psec { display: block; padding: 12px; border-bottom: 1px solid var(--line); flex: 0 0 auto; min-width: 0; }
.psec:last-child { border-bottom: 0; }
.psec > summary { display: block; list-style: none; cursor: default; pointer-events: none; }
.psec > summary::-webkit-details-marker { display: none; }
.psec > summary::marker { content: ""; }
.psec > summary :is(button, a, input, select) { pointer-events: auto; }
.psec > summary:focus-visible { outline-offset: -2px; }

.pane-body {

/* level 2: anything floating over a canvas */

  -webkit-mask: radial-gradient(circle, transparent 5.5px, #000 6.5px); mask: radial-gradient(circle, transparent 5.5px, #000 6.5px); }
.legend-chip.collapsed[data-kind="image"]::after { border-radius: 2px; opacity: 0.6; -webkit-mask: none; mask: none;
  background: repeating-conic-gradient(var(--ink-2) 0 25%, transparent 0 50%) 0 0 / 11px 11px; box-shadow: inset 0 0 0 1px var(--ink-2); }

/* the integral popover (a right click on a curve): values in B612 Mono, math in STIX, words in Archivo */
