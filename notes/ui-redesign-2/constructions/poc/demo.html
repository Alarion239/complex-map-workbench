.xf-pair { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
.xf-select { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 10px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-2); font: var(--t-label); color: var(--ink); white-space: nowrap; overflow: hidden; min-width: 0; cursor: pointer; }
.xf-select > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.xf-select .xf-dim { color: var(--muted); }
.xf-caret { margin-left: auto; color: var(--muted); display: inline-flex; }
select.xf-select { appearance: auto; padding: 0 4px 0 8px; }
.xf-custom { display: flex; align-items: center; gap: 8px; font: var(--t-label); color: var(--ink-2); }
.xf-input[aria-invalid="true"] { border-color: var(--error); }
.xf-input { height: 26px; width: 110px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: var(--r-2); background: var(--surface); font: var(--t-readout); color: var(--ink); }
.xf-ftwrap { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.xf-disc { display: flex; align-items: center; gap: 6px; font: var(--t-heading); color: var(--ink); text-align: left; }
.xf-disc small { font: var(--t-label); color: var(--muted); font-weight: 500; }
.xf-chev { display: inline-flex; color: var(--muted); }
.xf-ft { display: grid; gap: 10px; }
.xf-fr { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 8px; font: var(--t-label); color: var(--ink-2); }
.xf-fr .seg { height: 26px; }
.xf-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 14px 20px 16px; margin-top: 16px; border-top: 1px solid var(--line); background: var(--surface); }
.xf-name { display: inline-flex; align-items: center; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r-2); background: var(--surface-2); font: var(--t-readout); color: var(--ink); min-width: 0; }
.xf-nameinp { width: 15ch; max-width: 100%; border: 0; background: none; font: inherit; color: inherit; padding: 0; min-width: 0; }
.xf-nameinp:focus { outline: none; }
.xf-name:focus-within { border-color: var(--accent); }
.xf-ext { color: var(--muted); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink-2); }
.btn.xf-dest { height: 34px; padding: 0 14px; font-weight: 600; }
.btn.done { background: var(--good); border-color: var(--good); color: #fff; }
.xf-after2 { flex-basis: 100%; text-align: right; font: var(--t-label); color: var(--muted); }
@media (max-width: 900px) {
  .xf-body { grid-template-columns: 1fr; gap: 14px; }
  .xf-scroll { height: 45svh; min-height: 240px; }
  .xf-ctl { grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .xf-ctl .xf-row.wide, .xf-ctl .xf-ftwrap { grid-column: 1 / -1; }
  .xf-seg.big { height: 32px; min-height: 0; } .xf-seg.big > button { flex-direction: row; padding: 0 4px; } .xf-seg.big > button small, .xf-seg.big > button svg { display: none; }
  .xf-foot { position: sticky; bottom: 0; z-index: 3; }
}
@media (max-width: 560px) {
  .modal.xf { width: calc(100vw - 12px); max-height: calc(100svh - 12px); border-radius: var(--r-3); }
  .xf-head { padding: 12px 16px 0; } .xf-body { padding: 12px 16px 0; } .xf-foot { padding: 10px 16px 12px; }
  .xf-ctl { grid-template-columns: 1fr; }
  .xf-chip { display: none; }
  .xf-scroll { height: 38svh; }
  .xf-name { flex: 1 1 100%; } .xf-nameinp { flex: 1 1 auto; width: auto; }
  .xf-hint { white-space: normal; font-size: 11px; line-height: 13px; }
  .xf-foot .xf-sp { display: none; }
  .btn.xf-dest { flex: 1 1 0; padding: 0 8px; }
}
.modal p, .modal li { max-width: 68ch; }
.modal p + p { margin-top: 8px; }
.modal ul, .modal ol { padding-left: 18px; margin: 4px 0 0; display: grid; gap: 4px; }
.modal .kbd, table.keys .kbd { height: 20px; min-width: 20px; padding: 0 5px; font: 400 11px/16px var(--f-mono); color: var(--ink-2); background: var(--surface-2); }
.modal .close, .modal > .icon-btn:first-child { position: absolute; top: 16px; right: 16px; }
/* shortcuts: key/description pairs laid out two to a row (one per row on narrow screens) */
table.keys { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); width: 100%; margin-top: 8px; font: var(--t-body); }
table.keys :is(tbody, thead, tr) { display: contents; }
table.keys :is(td, th) { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-width: 0; min-height: 32px; padding: 5px 0; border-bottom: 1px solid var(--line); text-align: left; }
table.keys td:first-child { padding-right: 12px; white-space: nowrap; }
table.keys tr:nth-child(odd) > td:last-child { padding-right: 24px; }
table.keys th { font: var(--t-label); color: var(--muted); }
@media (max-width: 559px) {
  table.keys { grid-template-columns: max-content minmax(0, 1fr); }
  table.keys tr:nth-child(odd) > td:last-child { padding-right: 0; }
}

/* ======================================================================
   4. Breakpoints
   ====================================================================== */
/* 768px and up: panels collapse to 36px rails */
@media (min-width: 768px) {
  .layout.hide-left { --lw: 36px; }
  .layout.hide-right { --rw: 36px; }
  .layout.hide-left > .panel.left > :not(.rail), .layout.hide-right > .panel.right > :not(.rail) { display: none; }
  .layout.hide-left > .panel.left > .rail, .layout.hide-right > .panel.right > .rail { display: flex; }
  .layout.hide-left > .panel.left, .layout.hide-right > .panel.right { scrollbar-width: none; }
}
@media (max-width: 899px) { .wordmark { display: none; } }

/* 1024 to 1279: the left panel docks at 240px; the right panel keeps a 36px rail column, and showing it
   (the hide-right state that the header toggle, the rail chevron and ] flip) opens it as a 288px drawer. */
@media (min-width: 1024px) and (max-width: 1279px) {
  .layout { --lw: 240px; --rw: 36px; }
  .layout.hide-left { --lw: 36px; }
}
/* 768 to 1023: both panels keep 36px rail columns; showing either opens it as a drawer */
@media (min-width: 768px) and (max-width: 1023px) {
  .layout { --lw: 36px; --rw: 36px; }
}
/* drawers: level 3, absolute over the stage, sliding in over --t-med */
@media (min-width: 768px) and (max-width: 1279px) {
  .layout:not(.hide-right) > .panel.right {
    position: absolute; z-index: 20; top: 0; bottom: 0; right: 0; width: 288px;
    background: var(--surface); border-color: var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
    animation: drawer-r var(--t-med) var(--ease-out);
  }
}
@media (min-width: 768px) and (max-width: 1023px) {
  .layout:not(.hide-left) > .panel.left {
    position: absolute; z-index: 20; top: 0; bottom: 0; left: 0; width: 252px;
    background: var(--surface); border-color: var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3);
    animation: drawer-l var(--t-med) var(--ease-out);
  }
}
@keyframes drawer-r { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes drawer-l { from { transform: translateX(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Phone (< 768): single column, 16px gutters, no horizontal page scroll ---------- */
@media (max-width: 767px) {
  :root { --ruler: 14px; }
  html, body { height: auto; }
  html { scroll-padding-top: 52px; scroll-padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
  body { overflow-x: clip; }
  #app {
    display: block; height: auto; min-height: 100svh; overflow-x: clip;
    padding-top: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px) + 16px);
  }
  /* header: mark, "Map Workbench", Undo, Redo, and a more menu */
  .top { position: sticky; top: 0; z-index: 15; gap: 4px; background: var(--bg); margin: 0 -4px; padding: 0 4px; }
  .wordmark { display: block; font-size: 14px; margin-right: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* the view switch and the Deformation toggle share the bar (merged-views review): the words give way first, so
     the more menu always fits; below 430 px the mark stands alone */
  .top > .wordmark { flex: 0 1 auto; }
  .wm-pre, .hdiv, .top > .spacer { display: none; }
  .top > .vsw > button { padding: 0 7px; }
  .top > .defbtn { padding: 0 7px; }
  .hdr-more { display: inline-grid !important; }
  .top > .snd-ph:not([hidden]) { display: inline-grid; order: 13; flex-shrink: 0; }
  .top[data-snd="on"] .hdr-menu > #soundBtn { display: none !important; }
  .top .hdr-menu > .snd-btn .slbl { flex: 1 1 auto; }
  .top .hdr-menu > .snd-caret::before { position: static; width: 16px; height: 16px; flex: 0 0 16px; background: none; }
  .top .hdr-menu > .snd-caret .ic-slot { display: none; }
  .snd-pop { top: calc(48px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; width: auto; max-width: none; max-height: calc(100svh - 64px); }
  .top > .vsw, .top > .defbtn, .top > .hdr-more { flex-shrink: 0; }
  .hdr-menu:not(:popover-open) { display: none; }
  .hdr-menu:popover-open {
    position: fixed; inset: auto; top: calc(44px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); left: auto; bottom: auto;
    display: flex; flex-direction: column; width: min(240px, calc(100vw - 24px)); margin: 0; padding: 4px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-4); box-shadow: var(--shadow-3); color: var(--ink);
    animation: pop-in var(--t-med) var(--ease-out);
  }
  .hdr-menu::backdrop { background: transparent; }
  .top .hdr-menu > button:is(.btn, .icon-btn, .cmd-field) {
    display: flex; align-items: center; justify-content: flex-start; gap: 8px; flex: 0 0 auto; width: 100%; min-width: 0; max-width: none; height: 36px; margin: 0; padding: 0 8px;
    background: transparent; border: 0; border-radius: var(--r-2); box-shadow: none;
    font: var(--t-body); color: var(--ink); text-align: left;
  }
  .top .hdr-menu > button:is(.btn, .icon-btn, .cmd-field):is(:hover, :focus-visible) { background: var(--well); outline: none; }
  .hdr-menu > button .ic-slot { color: var(--ink-2); }
  .hdr-menu .mlabel { display: inline; flex: 1 1 auto; }
  .hdr-menu .exlabel, .hdr-menu .cmd-field .kbd, .hdr-menu #examplesBtn .ic-slot { display: none; }
  .hdr-menu #examplesBtn::before { content: ""; width: 16px; height: 16px; flex: 0 0 16px; }
  .hdr-menu > #toggleLeft { border-top: 1px solid var(--line); border-radius: 0; margin-top: 4px; padding-top: 4px; height: 40px; }
  /* the command field keeps its desktop margin (an id rule) and 14px icon otherwise: align it with the other rows */
  .top .hdr-menu > #cmdBtn { margin: 0; }
  .hdr-menu #cmdBtn .ic-slot, .hdr-menu #cmdBtn .ic-slot > svg { width: 16px; height: 16px; flex-basis: 16px; color: var(--ink-2); }
  .hdr-menu #cmdBtn .cmd-text { color: var(--ink); }
  .hdr-menu:popover-open { overflow-x: hidden; }
  .hdr-menu > [aria-pressed="true"]::after { content: ""; width: 8px; height: 4px; margin-right: 2px; border-left: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); transform: translateY(-2px) rotate(-45deg); }

  /* flow: planes, chain, region disclosures, guarantees */
  .layout { display: flex; flex-direction: column; gap: 12px; overflow: visible; }
  .stage { order: -1; display: flex; flex-direction: column; gap: 12px; }
  .panes, .panes.solo-L, .panes.solo-R { display: flex; flex-direction: column; gap: 8px; }
  .panes.solo-L > #paneR, .panes.solo-R > #paneL { display: grid; }
  /* a merged view is one panel on a phone too */
  .panes.merged-L > #paneR, .panes.merged-R > #paneL { display: none; }
  .gutter { display: none !important; }
  .pane { height: min(calc(100vw - 32px), 46svh); flex: 0 0 auto; }
  .pane-head { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .pane-head::-webkit-scrollbar { display: none; }
  .options { max-width: calc(100% - 56px); }
  .options .seg > button { padding: 0 6px; }
  .options select.sel { padding-right: 20px; }
  .options.transport, .options:has(> .transport) { right: 52px; }
  /* collapsed mode options: one 32px sliders button with a 44px hit area */
  .options.collapsed { padding: 0; min-height: 0; }
  .options.collapsed > .opts-btn { width: 32px; height: 32px; }
  .options > .opts-btn::after { content: ""; position: absolute; inset: -6px; }
  .vbtn { width: 30px; height: 31px; }
  .vbtn::after { content: ""; position: absolute; inset: -6px; }
  .chip.readout { max-width: calc(100% - 16px); }
  .plot:has(> .legend-chip:not([hidden])) > .chip.readout { max-width: calc(100% - 16px); }
  .legend-chip { top: 40px; }
  .plot:has(> .legend-chip:not([hidden], .collapsed)) > .empty-chip { top: 120px; }

  /* chain: its own strip */
  .pipe-wrap { display: block; }
  .pipe-head { flex-wrap: wrap; row-gap: 4px; padding: 6px 12px; min-height: 36px; white-space: normal; }
  .pipe-head .compose { flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
  .pipe-head .grow { display: none; }
  .pipeline { scroll-snap-type: x mandatory; }
  .card { flex-basis: min(240px, 78vw); width: min(240px, 78vw); }
  .card.region-card { flex-basis: min(200px, 70vw); width: min(200px, 70vw); }
  .pipeline.compact .card { flex-basis: min(200px, 70vw); width: min(200px, 70vw); }

  /* panels as disclosures */
  .panel { overflow: visible; }
  .panel.left { order: 0; display: flex; flex-direction: column; gap: 8px; background: none; border: 0; border-radius: 0; }
  .panel.right { order: 1; }
  .panel.left > .rail { display: none; }
  details.psec { padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-3); }
  details.psec::details-content { content-visibility: revert; display: revert; }
  details.psec > summary { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; pointer-events: auto; cursor: pointer; }
  details.psec > summary h2 { flex: 1 1 auto; margin: 0; }
  details.psec > summary::after { content: ""; flex: 0 0 auto; width: 6px; height: 6px; margin: 0 4px 3px 4px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2); transform: rotate(45deg); transition: transform var(--t-med) var(--ease-out); }
  details.psec[open] > summary::after { transform: translateY(3px) rotate(-135deg); }
  details.psec[open] > summary { border-bottom: 1px solid var(--line); }
  details.psec > .psec-body { padding: 12px; }
  .layout.hide-left > .panel.left > details.psec { display: none; }
  .layout.hide-left > .panel.left > .rail { display: flex; }

  /* guarantees: the rail becomes the summary row with the 8 lamps */
  .panel.right { display: block; }
  .panel.right > .rail {
    display: flex; flex-direction: row; align-items: center; gap: 12px; width: 100%; min-height: 44px; height: 44px; padding: 0 6px 0 12px;
  }
  .panel > .rail .rail-label { order: 1; margin: 0; padding: 0; writing-mode: horizontal-tb; transform: none; font: var(--t-heading); color: var(--ink); }
  .panel > .rail .rail-lamps { order: 2; flex-direction: row; padding: 0; }
  .panel > .rail .rail-count { order: 2; }
  .panel > .rail .rail-tools { display: none; }
  .panel > .rail .rail-open { order: 3; margin-left: auto; }
  .panel > .rail .rail-open > :is(.ic-slot, svg) { transform: rotate(-90deg); transition: transform var(--t-med) var(--ease-out); }
  .layout:not(.hide-right) > .panel.right > .rail { border-bottom: 1px solid var(--line); }
  .layout:not(.hide-right) > .panel.right > .rail .rail-open > :is(.ic-slot, svg) { transform: rotate(90deg); }
  .layout.hide-right > .panel.right > #propsPanel { display: none; }
  /* the summary row's chevron already folds the section; the docked panel's own hide button is redundant here */
  #propsPanel h2 > .icon-btn[aria-label="Hide guarantees"] { display: none; }
  .panel.left > .rail { border: 1px solid var(--line); border-radius: var(--r-3); background: var(--panel); }

  /* bottom toolbar: 52px plus the safe area, Select Point Circle Disc Rectangle Polygon More */
  #secDraw {
    position: fixed; z-index: 20; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 2px;
    height: calc(52px + env(safe-area-inset-bottom, 0px));
    padding: 4px max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px));
    background: var(--panel); border: 0; border-top: 1px solid var(--line-strong); border-radius: 0;
  }
  #secDraw > h2 { display: none; }
  #secDraw > .tools { display: flex; flex: 1 1 auto; gap: 2px; min-width: 0; }
  #secDraw > .tools > .tool { display: none; flex: 1 1 0; width: auto; }
  #secDraw > .tools > .tool:is([data-tool="select"], [data-tool="point"], [data-tool="circle"], [data-tool="disc"], [data-tool="rect"], [data-tool="polygon"]),
  #secDraw > .tools > .tool.on { display: block; }
  #secDraw .tool > span { font-size: 11px; }
  .tool-more { display: block; flex: 1 1 0; min-width: 0; max-width: 60px; }
  .tool-more > summary {
    position: relative; display: block; height: 44px; list-style: none; cursor: pointer;
    border: 1px solid transparent; border-radius: var(--r-2); color: var(--ink-2);
  }
  .tool-more > summary::-webkit-details-marker { display: none; }
  .tool-more > summary > .ic-slot { position: absolute; left: 50%; top: 7px; translate: -50% 0; width: 18px; height: 18px; }
  .tool-more > summary > .tm-label { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font: var(--t-label); font-size: 11px; font-stretch: semi-condensed; }
  .tool-more .tm-close, .tool-more[open] .tm-open { display: none; }
  .tool-more[open] .tm-close { display: inline; }
  .tool-more[open] > summary { background: var(--well); color: var(--ink); }
  /* More: bottom sheet, all keys in 5 columns, max 80svh */
  #secDraw:has(.tool-more[open]) {
    height: auto; max-height: 80svh; overflow-y: auto; flex-direction: column; align-items: stretch; gap: 8px;
    padding-top: 12px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border: 1px solid var(--line-strong); border-bottom: 0; border-radius: var(--r-4) var(--r-4) 0 0; box-shadow: var(--shadow-3);
  }
  #secDraw:has(.tool-more[open]) > .tools { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
  #secDraw:has(.tool-more[open]) > .tools > .tool { display: block; height: 52px; }
  #secDraw:has(.tool-more[open]) > .tools > .tool > svg { top: 8px; }
  #secDraw:has(.tool-more[open]) > .tool-more { order: 2; }

<script>'use strict';
// Constructions and shared parameters: a dependency-graph engine (proof of concept for
// notes/ui-redesign-2/constructions/DESIGN.md). Plain JS, no app code. Works in node (require) and in a page
// (window.Constr).
//
// Objects (nodes), each with a name that other objects and formulas refer to:
//   param    a real number with a slider range                      a = 0.5 on [-2, 2]
//   list     a family of real numbers                               k = [-2 ... 2]
//   value    a number (real or complex) defined by a formula        b = 2a + 1
//   point    free (dragged), at infinity, or defined by a formula   P = 1 + i,  Q = P + a
//   line     through two points                                     line(P, Q)
//   circle3  the generalized circle through three points            circle(P, Q, R): a line when they are collinear
//   circleCP centre and a point on it                                circle(P; Q)
//   circleCR centre and a radius formula                             circle(P; r = 2a)
//   bisector perpendicular bisector of two points
//   midpoint
//   meet     one intersection of two curves: index 0 is where curve 2 ENTERS the inside (left side) of curve 1,
//            index 1 where it leaves. One rule for lines and circles, so it is continuous through the line case
//   glider   a point on a curve, kept as a real parameter t: on circle(P, Q, R) the Moebius map sending 0, 1, inf to
//            P, Q, R (continuous through the line case, fixed relative to P, Q, R); on line(P, Q) P + t (Q - P)
//   equation an equation curve with parameters: Re z = a, Im z = b, |z - P| = r (one curve per value of a list)
//
// Every curve is a GENERALIZED CIRCLE in an oriented, normalized Hermitian form about an anchor o:
//   f(z) = A |z - o|^2 + 2 Re(conj(B) (z - o)) + C,   |B|^2 - A C = 1,   the left side (interior) is f < 0.
// A = 0 is a line (a circle through infinity). Near the curve f/2 is the signed distance, at any radius, so a circle
// through three almost collinear points is as accurate as the line it tends to. Three EXACTLY collinear points
// (decided by an exact orientation predicate) give A = 0 exactly: a true line, never a huge circle. A point BUILT on
// line(P, Q) (a meet with it, a glider on it, the midpoint of P and Q) is collinear with P and Q by INCIDENCE, which
// the graph tracks: its rounded coordinates may be off the line, but circle(P, Q, X) is still exactly the line.
// Revision 2 (review-users 1, 2, 6, 8, 9, 20; review-design 15, 17): incidence, the entering rule for meets, Moebius
// gliders, parallel lines meeting at infinity, the creation orientation, name rules, Apollonius and Steiner circles.
(function (root, factory) {
  const M = factory();
  if (typeof module === 'object' && module.exports) module.exports = M; else root.Constr = M;
})(typeof self !== 'undefined' ? self : this, function () {
  const EPS = 2 ** -53;
  const INF = 'inf';                       // the point at infinity
  const isInf = (p) => p === INF;

  // ---------------------------------------------------------------- exact orientation
  // sign-exact (q - p) x (r - p): a float filter (Shewchuk's bound), else exact BigInt arithmetic on the doubles
  const F64 = new Float64Array(1), U32 = new Uint32Array(F64.buffer);
  function decompose(x) {               // x = m * 2^e exactly
    if (x === 0) return [0n, 0];
    F64[0] = x;
    const lo = U32[0], hi = U32[1], ex = (hi >>> 20) & 0x7ff;
    let m = (BigInt(hi & 0xfffff) << 32n) | BigInt(lo), e;
    if (ex === 0) e = -1074; else { m |= 1n << 52n; e = ex - 1075; }
    return [hi >>> 31 ? -m : m, e];
  }
  function ldexp(x, k) { while (k > 1000) { x *= 2 ** 1000; k -= 1000; } while (k < -1000) { x *= 2 ** -1000; k += 1000; } return x * 2 ** k; }
  let exactCalls = 0;
  function orient(p, q, r) {
    const l = (q[0] - p[0]) * (r[1] - p[1]), rr = (q[1] - p[1]) * (r[0] - p[0]), det = l - rr;
    const bound = (3 + 16 * EPS) * EPS * (Math.abs(l) + Math.abs(rr));
    if (Math.abs(det) > bound) return det;
    exactCalls++;
    const ds = [p[0], p[1], q[0], q[1], r[0], r[1]].map(decompose);
    const E = Math.min(...ds.filter((d) => d[0] !== 0n).map((d) => d[1]), 0);
    const B = ds.map(([m, e]) => m << BigInt(e - E));
    const [px, py, qx, qy, rx, ry] = B;
    const D = (qx - px) * (ry - py) - (qy - py) * (rx - px);
    if (D === 0n) return 0;
    // the value, rounded (it may overflow to +-Infinity or underflow: the sign is kept either way)
    const neg = D < 0n, M = neg ? -D : D, sh = Math.max(0, M.toString(16).length * 4 - 64);
    const v = ldexp(Number(M >> BigInt(sh)), 2 * E + sh);
    return (neg ? -1 : 1) * (v === 0 ? Number.MIN_VALUE : v);
  }

  // ---------------------------------------------------------------- complex numbers [re, im]
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const mul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const div = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
  const scl = (a, s) => [a[0] * s, a[1] * s];
  const abs = (a) => Math.hypot(a[0], a[1]);
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const cross = (a, b) => a[0] * b[1] - a[1] * b[0];
  const cexp = (a) => { const r = Math.exp(a[0]); return [r * Math.cos(a[1]), r * Math.sin(a[1])]; };
  const clog = (a) => [Math.log(abs(a)), Math.atan2(a[1], a[0])];
  const cpow = (a, b) => {
    if (b[1] === 0 && Number.isInteger(b[0]) && Math.abs(b[0]) <= 64) {

    return cexp(mul(b, clog(a)));

  const csqrt = (a) => { const r = abs(a); const x = Math.sqrt((r + a[0]) / 2), y = Math.sqrt(Math.max(0, (r - a[0]) / 2)); return [x, a[1] < 0 ? -y : y]; };
  const csin = (a) => [Math.sin(a[0]) * Math.cosh(a[1]), Math.cos(a[0]) * Math.sinh(a[1])];
  const ccos = (a) => [Math.cos(a[0]) * Math.cosh(a[1]), -Math.sin(a[0]) * Math.sinh(a[1])];

  // ---------------------------------------------------------------- formulas
  // A small expression language for parameters, points and equations: + - * / ^, implicit products (2a, a b, 2(P+Q)),
  // |x|, functions (sin cos tan exp log sqrt abs re im arg conj), constants i, e, pi. A name is one letter with optional
  // digits (a, b, k, P, Q1). Reserved letters (the app's own meanings): z w x y r i e. (The app would use its own
  // Expr parser with a name scope instead: DESIGN.md, phase 1.)
  const RESERVED = new Set(['z', 'w', 'x', 'y', 'r', 'i', 'e']);
  const FUNCS = ['sqrt', 'conj', 'sin', 'cos', 'tan', 'exp', 'log', 'abs', 'arg', 'Re', 'Im', 're', 'im', 'ln'];
  class FormulaError extends Error {}
  // the Russian keyboard's look-alike letters become the Latin ones (а с е о р х у к, and the capitals); any other
  // Cyrillic letter is refused (a name must look the same to everyone: review-design 17)
  const HOMO = { 'а': 'a', 'с': 'c', 'е': 'e', 'о': 'o', 'р': 'p', 'х': 'x', 'у': 'y', 'к': 'k',
    'А': 'A', 'В': 'B', 'С': 'C', 'Е': 'E', 'Н': 'H', 'К': 'K', 'М': 'M', 'О': 'O', 'Р': 'P', 'Т': 'T', 'Х': 'X' };
  function latin(src) {
    const s = String(src).replace(/[\u0400-\u04FF]/g, (c) => HOMO[c] || c);
    if (/[\u0400-\u04FF]/.test(s)) { const e = new FormulaError('Use Latin letters for names'); e.ru = 'Используйте латинские буквы'; throw e; }
    return s;
  }

  // when EVERY letter is a known name or i, e, z ("ai" = a i); otherwise it is an error ("Unknown function sinc"),
  // never a set of new sliders (review-users 6). Without opt.known every run is refused.
  function tokenize(src, opt = {}) {
    const t = [];
    let i = 0;
    const s = latin(src).replace(/−/g, '-').replace(/·|×/g, '*').replace(/π/g, 'pi').replace(/\\pi/g, 'pi').replace(/\\left|\\right/g, '');
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      const num = /^(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?/.exec(s.slice(i));
      if (num) { t.push({ t: 'num', v: parseFloat(num[0]) }); i += num[0].length; continue; }
      if (/[A-Za-z\\]/.test(ch)) {
        const rest = s.slice(i).replace(/^\\/, '');
        const skip = s[i] === '\\' ? 1 : 0;
        // a function name not followed by another lowercase letter (Re z, Rez, sin(a), abs a)
        const fn = FUNCS.find((f) => rest.startsWith(f) && !/[a-y]/.test(rest[f.length] || ''));
        if (fn) { t.push({ t: 'fn', v: fn.toLowerCase() === 'ln' ? 'log' : fn.toLowerCase() }); i += fn.length + skip; continue; }
        if (rest.startsWith('pi') && !/[A-Za-z]/.test(rest[2] || '')) { t.push({ t: 'num', v: Math.PI }); i += 2 + skip; continue; }
        const run = /^[A-Za-z]{2,}/.exec(rest);
        if (run) {
          const ok = (c) => c === 'i' || c === 'e' || c === 'z' || (opt.known && opt.known.has(c));
          if (![...run[0]].every(ok)) throw new FormulaError(`Unknown function ${run[0]}`);
        }
        const nm = /^[A-Za-z](_?\d+)?/.exec(rest);
        const name = nm[0].replace('_', '');
        i += nm[0].length + skip;
        if (name === 'i') t.push({ t: 'cst', v: [0, 1] });
        else if (name === 'e') t.push({ t: 'cst', v: [Math.E, 0] });
        else t.push({ t: 'name', v: name });

      if (K.POINT_KINDS.has(d.kind) && v && !K.isInf(v)) { const [x, y] = toPx(v); taken.push([x - 7, y - 7, 14, 14]); }
      if (v && K.CURVE_KINDS.has(d.kind)) for (const g of (Array.isArray(v) ? v : [v])) strokes.push(...sampleCurve(g));
    }
    // areas first, then curves, then points
    for (const n of names) {
      const v = G.val(n), M = meta.get(n);
      if (!v || !M || !M.area || !K.CURVE_KINDS.has(G.get(n).def.kind)) continue;
      ctx.globalAlpha = dim(n); fillArea(v, alpha(TH.c[M.ci].c0, 0.16)); ctx.globalAlpha = 1;
    }
    for (const n of names) {
      const v = G.val(n), M = meta.get(n);
      if (!v || !K.CURVE_KINDS.has(G.get(n).def.kind)) continue;
      const list = Array.isArray(v) ? v : [v];
      ctx.globalAlpha = dim(n);
      for (const g of list) {
        const col = TH.c[M.ci].edge;
        if (emph && emph.has(n) && (hover === n || sel === n)) { ctx.strokeStyle = alpha(TH.accent, 0.35); ctx.lineWidth = 7; curvePath(g); ctx.stroke(); }
        ctx.strokeStyle = col; ctx.lineWidth = 1.75; curvePath(g); ctx.stroke();
      }
      // the curve's name near the view's centre point of it
      // the curve's name at 85 % of its visible arc (then 70, 55 %), on the outer side
      const g0 = list[list.length - 1], vis = sampleCurve(g0).filter(([x, y]) => x > 8 && y > 16 && x < W - 24 && y < H - 8);
      const own = new Set(vis.map(([x, y]) => x + ',' + y)), keep = strokes;
      strokes = strokes.filter(([x, y]) => !own.has(x + ',' + y));          // its own stroke may touch its label's side
      for (const f of [0.85, 0.7, 0.55, 0.4]) {
        if (!vis.length) break;
        const [px, py] = vis[Math.floor(f * (vis.length - 1))], at = toZ(px, py), G0 = K.geomOf(g0);
        const out = G0.line ? [-G0.d[1], -G0.d[0]] : [px - toPx(G0.c)[0], py - toPx(G0.c)[1]];
        const before = taken.length;
        label(n, at, TH.c[M.ci].edge, 6, -6, out);
        if (taken.length > before) break;
      }
      strokes = keep;
      ctx.globalAlpha = 1;
    }
    for (const n of names) {
      const d = G.get(n).def, v = G.val(n);
      if (!K.POINT_KINDS.has(d.kind) || !v || K.isInf(v)) continue;
      const [x, y] = toPx(v);
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      ctx.globalAlpha = dim(n);
      const free = G.draggable(n);
      if (hover === n || sel === n || picks.includes(n)) { ctx.fillStyle = alpha(TH.accent, 0.22); ctx.beginPath(); ctx.arc(x, y, 11, 0, 7); ctx.fill(); ctx.strokeStyle = TH.accent; ctx.lineWidth = 1.5; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(x, y, free ? 5.5 : 4.5, 0, 7);
      if (free) { ctx.fillStyle = TH.ink; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = TH.plane; ctx.stroke(); }
      else { ctx.fillStyle = TH.plane; ctx.fill(); ctx.lineWidth = 1.75; ctx.strokeStyle = TH.ink; ctx.stroke(); }
      label(n, v, TH.ink);
      ctx.globalAlpha = 1;
    }
    // the pending picks of a construction tool: a preview through the pointer
    if (pointer && picks.length && TOOLS[tool]) {
      const zs = picks.map((p) => G.val(p)).concat([pointer]);
      let g = null;
      if (tool === 'line' && zs.length === 2) g = K.line2(zs[0], zs[1]);
      if (tool === 'circle3' && zs.length === 3) g = K.circle3(...zs);
      if (tool === 'circle3' && zs.length === 2) g = K.line2(zs[0], zs[1]);
      if (tool === 'circleCP' && zs.length === 2) g = K.circleCP(zs[0], zs[1]);
      if (tool === 'bisector' && zs.length === 2) g = K.bisector(zs[0], zs[1]);
      if (g) { ctx.setLineDash([5, 4]); ctx.strokeStyle = TH.accent; ctx.lineWidth = 1.25; curvePath(g); ctx.stroke(); ctx.setLineDash([]); }
    }
  }

  // ---------------- the Objects panel
  const KIND_TEXT = {
    point: (d) => (d.expr != null ? null : 'free point'),
    line: (d) => `line through ${d.args.join(', ')}`,
    circle3: (d) => `circle through ${d.args.join(', ')}`,
    circleCP: (d) => `circle, centre ${d.args[0]}, through ${d.args[1]}`,
    bisector: (d) => `perpendicular bisector of ${d.args.join(', ')}`,
    midpoint: (d) => `midpoint of ${d.args.join(', ')}`,
    meet: (d) => `${d.args.join(' ∩ ')}, ${d.index ? 'second' : 'first'} point`,
    glider: (d) => `point on ${d.args[0]}`,
  };
  // object names in a sentence set in math italic (only names that exist: 'drag a point' keeps its article)
  const mathify = (s) => s.replace(/\b([A-Za-z])(\d*)\b/g, (m, a, n) => (G.has(m) ? `<i>${a}</i>${n ? `<sub>${n}</sub>` : ''}` : m));
  const fz = (z) => (K.isInf(z) ? '∞' : `${fmt4(z[0])} ${z[1] < 0 ? '−' : '+'} ${fmt4(Math.abs(z[1]))}<i>i</i>`);
  const fmt4 = (x) => { const r = Math.abs(x) < 5e-5 ? 0 : x; return (r < 0 ? '−' : '') + Math.abs(r).toFixed(2); };
  const nameHtml = (n) => { const m = /^([A-Za-z])(\d*)$/.exec(n); return `<i>${m[1]}</i>${m[2] ? `<sub>${m[2]}</sub>` : ''}`; };
  function defText(n) {
    const d = G.get(n).def;
    if (d.kind === 'equation') return eqHtml(d.src);
    if (d.kind === 'circle3') { const v = G.val(n); if (v && K.isLine(v)) return mathify(`line through ${d.args.join(', ')}`) + ' <span class="o-tag">collinear</span>'; }
    const f = KIND_TEXT[d.kind];
    return f ? mathify(f(d) || '') : '';
  }
  const eqHtml = (src) => src.replace(/\bRe\b/g, 'Re').replace(/\bIm\b/g, 'Im').replace(/-/g, '−').replace(/\b([a-zA-Z])\b(?![a-z])/g, (m, a) => (m === 'Re' || m === 'Im' ? m : `<i>${a}</i>`));
  function rowHtml(n) {
    const d = G.get(n).def, v = G.val(n), err = G.err(n), M = meta.get(n) || {};
    const isCurve = K.CURVE_KINDS.has(d.kind), isPt = K.POINT_KINDS.has(d.kind);
    let sw = '';
    if (isCurve) sw = `<span class="o-sw" style="--sw:var(--c${(M.ci || 0) + 1}-edge);--swf:var(--c${(M.ci || 0) + 1})" data-area="${M.area ? 1 : 0}"></span>`;
    else if (isPt) sw = `<span class="o-pt${G.draggable(n) ? ' free' : ''}"></span>`;
    let body = '';
    if (d.kind === 'param') {
      body = `<div class="o-def"><span class="mono">${fmt4(v)}</span></div>
        <div class="o-slider"><span class="mono o-lim">${fmtN(d.min)}</span><input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${v}" data-param="${n}" aria-label="${n}"><span class="mono o-lim">${fmtN(d.max)}</span>
        <button class="icon-btn small o-play" data-play="${n}" aria-label="Play ${n}" title="Play"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M5 3.5v9l7.5-4.5z" fill="currentColor"/></svg></button></div>`;
    } else {
      const def = defText(n);
      const valTxt = isPt && v ? `<span class="mono o-val">${fz(v)}</span>` : '';
      body = `<div class="o-def">${def}${def && valTxt ? ' ' : ''}${valTxt}</div>`;
      if (err) body += `<div class="o-err">${mathify(err)}</div>`;
    }
    const used = [...G.directDependents(n)];
    const uses = G.get(n).deps;
    const rel = d.kind === 'param' ? `<div class="o-rel">${used.length ? `used by ${used.map(nameHtml).join(', ')}` : 'not used yet: type its name in any field'}</div>` : (sel === n) ? `<div class="o-rel">${uses.length ? `uses ${uses.map(nameHtml).join(', ')}` : 'free'}${used.length ? ` · used by ${used.map(nameHtml).join(', ')}` : ''}</div>` : '';
    return `<div class="o-row${sel === n ? ' sel' : ''}${err ? ' undef' : ''}" data-name="${n}">${sw || '<span></span>'}<span class="o-name">${nameHtml(n)}${d.kind === 'param' ? ' =' : ''}</span><div class="o-body">${body}${rel}</div></div>`;
  }
  function renderPanel() {
    const names = [...meta.keys()].filter((n) => G.has(n));   // the order they were made in
    const nums = names.filter((n) => ['param', 'list', 'value'].includes(G.get(n).def.kind));
    const pts = names.filter((n) => K.POINT_KINDS.has(G.get(n).def.kind));
    const cur = names.filter((n) => K.CURVE_KINDS.has(G.get(n).def.kind));
    $('numList').innerHTML = nums.map(rowHtml).join('');
    $('curveList').innerHTML = cur.map(rowHtml).join('');
    $('pointList').innerHTML = pts.map(rowHtml).join('');
    $('numCount').textContent = nums.length; $('curveCount').textContent = cur.length; $('pointCount').textContent = pts.length;
  }
  // light updates during a drag: values and errors only (no rebuild of the rows)
  function refreshValues(changed) {
    for (const n of changed) {
      const row = document.querySelector(`.o-row[data-name="${n}"]`);
      if (!row) continue;
      const d = G.get(n).def;
      if (d.kind === 'param') { row.querySelector('.o-def .mono').textContent = fmt4(G.val(n)); const r = row.querySelector('input'); if (document.activeElement !== r) r.value = G.val(n); continue; }
      const html = rowHtml(n), tmp = document.createElement('div'); tmp.innerHTML = html;
      const nb = tmp.firstElementChild;
      if (row.className !== nb.className) row.className = nb.className;
      const b0 = row.querySelector('.o-body'), b1 = nb.querySelector('.o-body');
      if (b0.innerHTML !== b1.innerHTML) b0.innerHTML = b1.innerHTML;
    }
  }

  // ---------------- tools
  const TOOLS = {
    move: { n: 0, hint: 'Drag a black point or a slider; everything built on it follows. Drag empty space to pan.' },
    point: { n: 1, hint: 'Click to place a free point.' },
    line: { n: 2, kind: 'line', hint: 'Line through two points: click a point or empty space ({k} of 2).' },
    circle3: { n: 3, kind: 'circle3', hint: 'Circle through three points: click a point or empty space ({k} of 3).', area: true },
    circleCP: { n: 2, kind: 'circleCP', hint: 'Circle by centre and point: click the centre, then a point on it ({k} of 2).' },
    bisector: { n: 2, kind: 'bisector', hint: 'Perpendicular bisector: click two points ({k} of 2).' },
    meet: { n: 2, curves: true, hint: 'Intersection: click two curves ({k} of 2).' },
  };
  function setTool(t) {
    tool = t; picks = [];
    for (const b of document.querySelectorAll('#tools [data-tool]')) b.setAttribute('aria-pressed', String(b.dataset.tool === t));
    showHint(); dirty = true;
  }
  function showHint() { const T = TOOLS[tool]; $('hint').textContent = T.hint.replace('{k}', picks.length + 1); }
  const USED = () => new Set(G.names());
  function nextName(upper) {
    const set = USED(), letters = upper ? 'ABCDEFGHJKLMNOPQRSTUVW' : 'cdfghklmnpqstuv';
    for (const L of letters) if (!set.has(L)) return L;
    for (let k = 1; ; k++) for (const L of letters) if (!set.has(L + k)) return L + k;
  }
  let ciNext = 3;
  function hitPoint(x, y) {
    let best = null, bd = 12;
    for (const n of G.names()) { const d = G.get(n).def, v = G.val(n); if (!K.POINT_KINDS.has(d.kind) || !v || K.isInf(v)) continue; const [px, py] = toPx(v), dd = Math.hypot(px - x, py - y); if (dd < bd) { bd = dd; best = n; } }
    return best;
  }
  function hitCurve(x, y) {
    const z = toZ(x, y);
    let best = null, bd = 8 / view.s;
    for (const n of G.names()) { const v = G.val(n); if (!v || Array.isArray(v) || !K.CURVE_KINDS.has(G.get(n).def.kind)) continue; const d = Math.abs(K.fOf(v, z)) / 2 * (K.isLine(v) ? 1 : 1); if (d < bd) { bd = d; best = n; } }
    return best;
  }
  const snap = (z) => ($('snapChk').checked ? [Math.round(z[0] * 4) / 4, Math.round(z[1] * 4) / 4] : z);
  function pickPoint(x, y) {
    const h = hitPoint(x, y);
    if (h) return h;
    const n = nextName(true);
    addObj(n, { kind: 'point', at: snap(toZ(x, y)) });
    return n;
  }
  function complete() {
    const T = TOOLS[tool];
    if (T.curves) {
      const [a, b] = picks, ga = G.val(a), gb = G.val(b);
      const twoLines = ga && gb && K.isLine(ga) && K.isLine(gb);
      const n1 = nextName(true); addObj(n1, { kind: 'meet', args: [a, b], index: 0 });
      if (!twoLines) { const n2 = nextName(true); addObj(n2, { kind: 'meet', args: [a, b], index: 1 }); }
    } else {
      const n = nextName(false);
      addObj(n, { kind: T.kind, args: picks.slice() }, { ci: (ciNext++) % 8, area: !!T.area });
      sel = n;
    }
    picks = []; renderPanel(); showHint(); dirty = true;
  }

  // ---------------- pointer
  function evXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  cv.addEventListener('pointerdown', (e) => {
    const [x, y] = evXY(e);
    cv.setPointerCapture(e.pointerId);
    if (tool === 'move') {
      const h = hitPoint(x, y);
      if (h && G.draggable(h)) { drag = { name: h }; sel = h; renderPanel(); }
      else if (h) { sel = h; renderPanel(); flash(`${h} is built from ${[...G.get(h).deps].join(', ')}: drag those`); }
      else { const c = hitCurve(x, y); if (c) { sel = c; renderPanel(); } drag = { pan: true, x, y, cx: view.cx, cy: view.cy }; }
      dirty = true; return;
    }
    if (tool === 'point') { const n = nextName(true); addObj(n, { kind: 'point', at: snap(toZ(x, y)) }); sel = n; renderPanel(); dirty = true; return; }
    const T = TOOLS[tool];
    if (T.curves) { const c = hitCurve(x, y); if (!c || picks.includes(c)) { flash('Click a curve'); return; } picks.push(c); }
    else picks.push(pickPoint(x, y));
    if (picks.length === T.n) complete(); else { renderPanel(); showHint(); }
    dirty = true;
  });
  cv.addEventListener('pointermove', (e) => {
    const [x, y] = evXY(e);
    pointer = snap(toZ(x, y));
    if (drag && drag.name) {
      const t0 = performance.now();
      const changed = G.drag(drag.name, snap(toZ(x, y)));
      engineMs = performance.now() - t0;
      refreshValues(changed);
    } else if (drag && drag.pan) {
      view.cx = drag.cx - (x - drag.x) / view.s; view.cy = drag.cy + (y - drag.y) / view.s;
    } else {
      const h = hitPoint(x, y) || hitCurve(x, y);
      if (h !== hover) { hover = h; markRows(); }
      cv.style.cursor = tool !== 'move' ? 'crosshair' : h && G.draggable(h) ? 'grab' : 'default';
    }
    dirty = true;
  });
  const end = () => { drag = null; dirty = true; };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', () => { hover = null; pointer = null; markRows(); dirty = true; });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); const [x, y] = evXY(e), z = toZ(x, y); view.s *= Math.exp(-e.deltaY * 0.0016); const z2 = toZ(x, y); view.cx += z[0] - z2[0]; view.cy += z[1] - z2[1]; dirty = true; }, { passive: false });
  function markRows() { for (const r of document.querySelectorAll('.o-row')) { const n = r.dataset.name, em = emphasis(); r.classList.toggle('hl', !!(em && em.has(n))); } }
  // panel events
  const panel = $('objPanel');
  panel.addEventListener('input', (e) => {
    const n = e.target.dataset.param; if (!n) return;
    const t0 = performance.now(); const ch = G.set(n, +e.target.value); engineMs = performance.now() - t0;
    refreshValues(ch); dirty = true;
  });
  panel.addEventListener('pointerover', (e) => { const r = e.target.closest('.o-row'); const n = r ? r.dataset.name : null; if (n !== hover) { hover = n; markRows(); dirty = true; } });
  panel.addEventListener('pointerleave', () => { hover = null; markRows(); dirty = true; });
  panel.addEventListener('click', (e) => {
    const pb = e.target.closest('[data-play]');
    if (pb) { const n = pb.dataset.play; playing = playing === n ? null : n; pb.classList.toggle('on', playing === n); return; }
    const r = e.target.closest('.o-row'); if (r && !e.target.closest('input')) { sel = sel === r.dataset.name ? null : r.dataset.name; renderPanel(); markRows(); dirty = true; }
  });
  // the Add field: an equation (Re z = b), a number (b = 2), a point (T = 1 + i); a new lowercase name becomes a slider
  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const src = $('addInp').value.trim(); if (!src) return;
    try {
      const m = /^([A-Za-z]\d*)\s*=\s*(.+)$/.exec(src);
      let made = [];
      const autoSliders = (s) => { for (const nm of K.namesOf(K.parse(s))) if (!G.has(nm)) { if (/^[a-z]/.test(nm)) { addObj(nm, { kind: 'param', value: 1, min: -5, max: 5, step: 0.01 }); made.push(nm); } else throw new K.FormulaError(`${nm} is not defined`); } };
      if (m && !/z/.test(m[2]) && !G.has(m[1])) {
        const name = m[1], rhs = m[2];
        if (/^-?[\d.]+$/.test(rhs) && /^[a-z]/.test(name)) addObj(name, { kind: 'param', value: +rhs, min: Math.min(-5, +rhs), max: Math.max(5, +rhs), step: 0.01 });
        else { autoSliders(rhs); addObj(name, { kind: /^[A-Z]/.test(name) ? 'point' : 'value', expr: rhs }); }
        sel = name;
      } else {
        autoSliders(src);
        const n = nextName(false); addObj(n, { kind: 'equation', src }, { ci: (ciNext++) % 8 }); sel = n;
      }
      $('addInp').value = ''; $('addErr').textContent = '';
      if (made.length) flash(`Added slider${made.length > 1 ? 's' : ''} ${made.join(', ')}`);
    } catch (err) { $('addErr').textContent = err.message; }
    renderPanel(); dirty = true;
  });
  for (const b of document.querySelectorAll('#tools [data-tool]')) b.addEventListener('click', () => setTool(b.dataset.tool));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { setTool('move'); } });
  let flashT = 0;
  function flash(msg) { const f = $('flash'); f.innerHTML = mathify(msg); f.hidden = false; clearTimeout(flashT); flashT = setTimeout(() => (f.hidden = true), 2200); }
  $('themeBtn').addEventListener('click', () => {
    const r = document.documentElement, cur = r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    r.dataset.theme = cur === 'dark' ? 'light' : 'dark'; readTheme(); dirty = true;
  });
  $('resetBtn').addEventListener('click', () => { reset(); sel = null; renderPanel(); dirty = true; });

  // ---------------- frame loop
  let playing = null, engineMs = 0, drawMs = 0, lastEng = -1, ems = [], frames = [], lastT = performance.now(), dir = 1;
  function frame(t) {
    frames.push(t - lastT); lastT = t; if (frames.length > 60) frames.shift();
    if (playing) {
      const d = G.get(playing).def; let v = G.val(playing) + dir * (d.max - d.min) / 240;
      if (v > d.max || v < d.min) { dir = -dir; v = Math.max(d.min, Math.min(d.max, v)); }
      const t0 = performance.now(); refreshValues(G.set(playing, v)); engineMs = performance.now() - t0; dirty = true;
    }
    if (engineMs !== lastEng) { lastEng = engineMs; ems.push(engineMs); if (ems.length > 30) ems.shift(); }
    const emed = ems.length ? ems.slice().sort((x, y) => x - y)[ems.length >> 1] : 0;
    if (dirty) { const t0 = performance.now(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); drawMs = performance.now() - t0; dirty = false; }
    $('perf').textContent = `update ${emed.toFixed(3)} ms · draw ${drawMs.toFixed(1)} ms · ${G.names().length} objects`;
    requestAnimationFrame(frame);
  }
  // test hooks for the screenshots
  window.__demo = { G, K, view, setTool, toPx, toZ, setSel: (n) => { sel = n; renderPanel(); markRows(); dirty = true; }, setHover: (n) => { hover = n; markRows(); dirty = true; }, redraw: () => { readTheme(); renderPanel(); dirty = true; }, flash };
  readTheme(); reset(); renderPanel(); setTool('move'); resize();
  window.addEventListener('resize', resize);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readTheme(); dirty = true; });
  requestAnimationFrame(frame);
})();
</script>
</body></html>
