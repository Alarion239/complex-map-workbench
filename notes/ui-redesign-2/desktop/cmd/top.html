<header class="top" id="top" data-snd="off">
    <svg viewBox="0 0 28 28" width="22" height="22" aria-hidden="true" class="mark">
      <defs><clipPath id="mk"><rect x="2.25" y="2.25" width="23.5" height="23.5" rx="1.25"></rect></clipPath></defs>
      <rect x="1.5" y="1.5" width="25" height="25" rx="2" fill="var(--plane)" stroke="var(--ink)" stroke-width="1.25"></rect>
      <g clip-path="url(#mk)" fill="none" stroke-width="1.15" stroke-linecap="round">
        <g stroke="var(--ink)"><path d="M6.51 25.62Q27.83 14 6.51 2.38"></path><path d="M15.78 25.62Q25.76 14 15.78 2.38"></path><path d="M21.67 25.62Q27.93 14 21.67 2.38"></path></g>
        <g stroke="var(--accent)"><path d="M21.49 25.62Q0.17 14 21.49 2.38"></path><path d="M12.22 25.62Q2.24 14 12.22 2.38"></path><path d="M6.33 25.62Q0.07 14 6.33 2.38"></path></g>
      </g>
      <circle cx="14" cy="14" r="1.4" fill="var(--ink)"></circle>
    </svg>
    <h1 class="wordmark"><span class="wm-pre">Complex </span>Map Workbench</h1>
    <span class="hdiv" aria-hidden="true"></span>
    <button class="icon-btn" id="undoBtn" title="Undo  ⌘Z" aria-label="Undo" disabled=""><span class="ic-slot" data-icon="undo"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5l-3 3 3 3M2.5 6.5h7a3.5 3.5 0 0 1 0 7H6"></path></svg></span></button>
    <button class="icon-btn" id="redoBtn" title="Redo  ⇧⌘Z" aria-label="Redo" disabled=""><span class="ic-slot" data-icon="redo"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3.5l3 3-3 3M13.5 6.5h-7a3.5 3.5 0 0 0 0 7H10"></path></svg></span></button>
    <div class="spacer"></div>
    <!-- the views (merged-views.md): X → Y · Phase · Landscape (1 2 3), and the Deformation toggle (M), which modifies
         the active view; app.js fills them -->
    <div class="seg modes vsw" id="viewSwitch" role="radiogroup" aria-label="View" style="--seg-x: 2px; --seg-w: 77px;"><button data-mode="xy" role="radio" data-tip="X → Y: the shapes and their images  1" aria-label="X → Y" class="on" aria-checked="true"><svg class="mic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="4" width="5" height="8" rx=".8"></rect><rect x="9.5" y="4" width="5" height="8" rx=".8"></rect><path d="M6.5 8h2.6M8 6.7l1.3 1.3L8 9.3"></path></svg><span><i>X</i><span class="arr"> → </span><i>Y</i></span></button><button data-mode="phase" role="radio" data-tip="Phase portrait of F  2" aria-label="Phase" tabindex="-1" aria-checked="false"><svg class="mic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"></circle><path d="M8 8h5.5M8 8l-2.75 4.76M8 8l-2.75-4.76"></path></svg><span>Phase</span></button><button data-mode="land" role="radio" data-tip="Landscape of F  3" aria-label="Landscape" tabindex="-1" aria-checked="false"><svg class="mic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12.5c2.5 0 3.5-6 6.5-6s4 6 6.5 6"></path><path d="M1.5 14h13"></path></svg><span>Landscape</span></button></div>
    <button class="phbtn defbtn" id="morphBtn" aria-pressed="false" data-tip="Deformation of F  M" aria-label="Deformation" aria-disabled="false"><svg class="mic" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="6" width="4" height="4"></rect><path d="M6.5 6.5c2-3 4.5-3 6 0"></path><path d="M11.5 4.5l1 2-2.2.3"></path><circle cx="12.5" cy="10.5" r="2" fill="currentColor" stroke="none"></circle></svg><span>Deformation</span></button>
    <div class="spacer spacer2"></div>
    <!-- Desktop: display:contents, so these sit in the header row (CSS order puts Examples after the divider).
         Phone: the popover is the "more" menu. popovertargetaction="hide" closes it after a choice. -->
    <div class="hdr-menu" id="hdrMenu" popover="">
      <button class="btn ghost menu-btn" id="examplesBtn" aria-haspopup="menu" popovertarget="hdrMenu" popovertargetaction="hide"><span class="mlabel">Examples</span><span class="exlabel">Examples</span><span class="ic-slot" data-icon="chevD"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"></path></svg></span></button>
      <button class="cmd-field" id="cmdBtn" aria-label="Add function or command" popovertarget="hdrMenu" popovertargetaction="hide"><span class="ic-slot" data-icon="search"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.25"></circle><path d="M10.25 10.25l3.25 3.25"></path></svg></span><span class="cmd-text">Add function or command</span><span class="kbd" id="cmdKbd">⌘K</span></button>
      <button class="icon-btn" id="toggleLeft" aria-pressed="true" title="Region tools  [" aria-label="Show or hide region tools" popovertarget="hdrMenu" popovertargetaction="hide"><span class="ic-slot" data-icon="panelL"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="1.5"></rect><path d="M6 2.5v11"></path></svg></span><span class="mlabel">Region tools panel</span></button>
      <button class="icon-btn" id="toggleRight" aria-pressed="true" title="Guarantees  ]" aria-label="Show or hide guarantees" popovertarget="hdrMenu" popovertargetaction="hide"><span class="ic-slot" data-icon="panelR"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="1.5"></rect><path d="M10 2.5v11"></path></svg></span><span class="mlabel">Guarantees panel</span></button>
      <button class="icon-btn" id="exportBtn" title="Export images or LaTeX" aria-label="Export images or LaTeX" aria-haspopup="menu" popovertarget="hdrMenu" popovertargetaction="hide"><span class="ic-slot" data-icon="download"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"></path></svg></span><span class="mlabel">Export</span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Theme: Auto" popovertarget="hdrMenu" popovertargetaction="hide" data-tip="Theme: Auto"><span class="ic-slot" data-icon="theme"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.75"></circle><path d="M8 2.25a5.75 5.75 0 0 1 0 11.5z" fill="currentColor" stroke="none"></path></svg></span><span class="mlabel">Theme: <span class="tlabel">Auto</span></span></button>
      <!-- Sound (notes/sound/DESIGN.md §2.1): a split button, the switch and its settings; off by default -->
      <button class="icon-btn snd-btn" id="soundBtn" aria-pressed="false" aria-label="Sound" title="Sound (Shift+M)" aria-keyshortcuts="Shift+M" popovertarget="hdrMenu" popovertargetaction="hide"><span class="ic-slot snd-ic" data-on="false"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"></path><path d="M10.5 6l3.5 3.5M14 6l-3.5 3.5"></path></svg></span><span class="slbl">Sound</span></button>
      <button class="icon-btn snd-caret" id="soundMore" aria-haspopup="dialog" aria-expanded="false" aria-controls="sndPop" title="Sound settings" aria-label="Sound settings" popovertarget="hdrMenu" popovertargetaction="hide"><span class="ic-slot" data-icon="chevD"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"></path></svg></span><span class="mlabel">Sound settings</span></button>
      <button class="icon-btn" id="helpBtn" title="Help  ?" aria-label="Help" aria-haspopup="menu" aria-expanded="false" popovertarget="hdrMenu" popovertargetaction="hide"><span class="ic-slot" data-icon="help"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"></circle><path d="M6.3 6.3a1.8 1.8 0 1 1 2.4 1.7c-.5.2-.7.6-.7 1.1v.4"></path><circle cx="8" cy="11.6" r=".8" fill="currentColor" stroke="none"></circle></svg></span><span class="mlabel">Help</span></button>
    </div>
    <button class="icon-btn snd-ph" id="soundPh" aria-pressed="false" title="Sound is on: turn it off (Shift+M)" aria-label="Sound" aria-keyshortcuts="Shift+M" hidden=""><span class="ic-slot snd-ic" data-on="false"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"></path><path d="M10.5 6l3.5 3.5M14 6l-3.5 3.5"></path></svg></span></button>
    <button class="icon-btn hdr-more" id="hdrMoreBtn" popovertarget="hdrMenu" title="More" aria-label="More"><span class="ic-slot" data-icon="more"><svg class="ic" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="3.5" cy="8" r="1.1"></circle><circle cx="8" cy="8" r="1.1"></circle><circle cx="12.5" cy="8" r="1.1"></circle></svg></span></button>
  </header>
